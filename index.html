<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Octagon Edge</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Source+Sans+3:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{--bg:#F2F4F7;--surface:#fff;--ink:#16212B;--muted:#5C6B78;--line:#D6DCE3;--accent:#C4162B;--good:#1F7A4D;--bad:#B23A2A;--tile:#EEF1F5}
@media (prefers-color-scheme:dark){:root{--bg:#0F1418;--surface:#171D23;--ink:#E9EDF0;--muted:#98A5B0;--line:#2B353E;--accent:#FF4D5E;--good:#4CC38A;--bad:#F07C6C;--tile:#1E262E}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Source Sans 3",system-ui,sans-serif;font-size:15px;line-height:1.45}
main{max-width:1000px;margin:0 auto;padding:20px 16px 60px}h1,h2{font-family:"Barlow Condensed",sans-serif;margin:0}h1{font-size:40px;line-height:1}h2{font-size:22px;margin-top:26px;padding-top:10px;border-top:2px solid var(--ink)}
.eyebrow{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}.mono{font-family:"JetBrains Mono",monospace;font-variant-numeric:tabular-nums}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:16px}.tile{background:var(--tile);padding:12px 14px;border-left:3px solid var(--accent)}.tile .k{font-family:"JetBrains Mono",monospace;font-size:24px;font-weight:600}.tile .l{color:var(--muted);font-size:12px;margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:13px;background:var(--surface);margin-top:10px}table.fit{table-layout:fixed;font-size:12px}table.fit td,table.fit th{white-space:normal;padding:5px 6px;vertical-align:top}table.fit td.mk{word-break:break-word}table.fit .num{white-space:nowrap}th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}.num{text-align:right;font-family:"JetBrains Mono",monospace;font-variant-numeric:tabular-nums}.wrap{overflow-x:auto}
.ok{color:var(--good);font-weight:600}.bad{color:var(--bad);font-weight:600}.pill{display:inline-block;padding:2px 8px;border-radius:3px;font-family:"JetBrains Mono",monospace;font-size:11px}.pill.ok{background:var(--good);color:#fff}.pill.bad{background:var(--bad);color:#fff}
#gate{max-width:420px;margin:80px auto;background:var(--surface);padding:28px;border:1px solid var(--line)}input{width:100%;font-size:16px;padding:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);margin:12px 0}button{font-size:15px;padding:10px 16px;background:var(--accent);color:#fff;border:0;cursor:pointer}button:focus,input:focus{outline:2px solid var(--accent);outline-offset:2px}
.small{color:var(--muted);font-size:12px}label{font-size:13px;color:var(--muted)}#err{color:var(--bad);min-height:1.2em}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
</style></head><body><main>
<div id="gate"><div class="eyebrow">Octagon Edge</div><h1>Status</h1><p class="small">This page is public but its data is encrypted. Enter the passphrase to decrypt it in your browser; nothing is sent anywhere.</p>
<form id="f"><label for="pw">Passphrase</label><input id="pw" type="password" autocomplete="current-password" autofocus><div class="row"><button type="submit">Unlock</button><label><input type="checkbox" id="rem" style="width:auto;margin:0 6px 0 0">remember on this device</label></div><div id="err"></div></form></div>
<div id="app" hidden></div>
</main>
<script>
const $=s=>document.querySelector(s);const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function decrypt(enc,pw){const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(enc.salt),iterations:enc.iter,hash:'SHA-256'},key,{name:'AES-GCM',length:256},false,['decrypt']);const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(enc.iv)},k,b64(enc.ct));return JSON.parse(new TextDecoder().decode(pt));}
async function load(pw){const r=await fetch('status.enc.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('status file missing');return decrypt(await r.json(),pw);}
const f=v=>v==null||Number.isNaN(v)?'':(typeof v==='number'?(Math.abs(v)<10?v.toFixed(3):v.toLocaleString(undefined,{maximumFractionDigits:0})):String(v));
const money=v=>v==null?'':(v<0?'−$':'$')+Math.abs(v).toLocaleString(undefined,{maximumFractionDigits:0});
function render(P){const age=Math.round((Date.now()-new Date(P.generated))/60000);const jobs=P.jobs.map(j=>`<tr><td>${j.job}</td><td><span class="pill ${j.ok?'ok':'bad'}">${j.ok?'OK':'DOWN'}</span></td><td class="num">${j.age_min==null?'never':j.age_min+' min'}</td><td class="small">${Object.entries(j.detail).map(([k,v])=>k+'='+v).join(', ')}</td></tr>`).join('');
const g=P.gates||{};const PA=P.paper_account||{};const qj=(P.jobs||[]).find(j=>j.job==='paper_quoter');
const paper=g.paper?`<div class="tile"><div class="k ${g.paper.informed_share_7d<=0.2?'ok':'bad'}">${g.paper.informed_share_7d==null?'—':Math.round(g.paper.informed_share_7d*100)+'%'}</div><div class="l">informed-fill share, 7d (gate ≤20%) · ${g.paper.fills_7d} graded paper fills</div></div><div class="tile"><div class="k">${money(g.paper.spread_pnl+g.paper.reward+g.paper.adverse_pnl)}</div><div class="l">paper P&L 7d: spread ${money(g.paper.spread_pnl)}, rewards ${money(g.paper.reward)}, adverse ${money(g.paper.adverse_pnl)}</div></div>`:`<div class="tile"><div class="k ${qj&&qj.ok?'ok':'bad'}">${qj&&qj.ok?'running':'down'}</div><div class="l">paper quoter · ${PA.equity!=null?money(PA.equity)+' equity, '+(PA.fills||0)+' graded fills':'no account yet'} · informed-fill gate ≤20% (needs ≥300 fills)</div></div>`;
const led=g.ledger?`<div class="tile"><div class="k ${g.ledger.mean_clv>=0?'ok':'bad'}">${(g.ledger.mean_clv*100).toFixed(1)} pts</div><div class="l">mean closing-line value · ${g.ledger.bets} paper bets ($20 each of a $1,000 bankroll), ${g.ledger.open} open, ${g.ledger.settled} settled, P&L ${money(g.ledger.pnl)}</div></div>`:`<div class="tile"><div class="k">0</div><div class="l">paper bets logged (scanner runs 09:15 / 18:15)</div></div>`;
const pk=P.picks&&P.picks.rows?P.picks.rows:[];const picks=pk.length?`<p class="small">${P.picks.file} · scanned ${P.picks.at}</p><div class="wrap"><table><tr><th>fighter / prop</th><th>class</th><th>best price</th><th>book</th><th class="num">implied</th><th class="num">consensus</th><th class="num">model</th><th class="num">pred. close</th><th class="num">edge</th><th class="num">stake</th></tr>${pk.map(r=>`<tr><td>${r.fighter}</td><td>${r.wc||''}</td><td class="mono">${r.best_price}</td><td>${r.book}</td><td class="num">${f(r.implied)}</td><td class="num">${f(r.fair_consensus)}</td><td class="num">${f(r.model)}</td><td class="num">${f(r.pred_close)}</td><td class="num ${r.edge_vs_best>=0.04?'ok':''}">${r.edge_vs_best==null?'':(r.edge_vs_best>0?'+':'')+r.edge_vs_best.toFixed(3)}</td><td class="num">${r.stake_frac?(r.stake_frac*100).toFixed(1)+'%':''}</td></tr>`).join('')}</table></div>`:'<p class="small">no scan yet</p>';
const B=P.books||{};const books=B.rows?`<p class="small">${B.snapshots.toLocaleString()} snapshots today over ${B.markets} markets (${B.first} → ${B.last}); median spread ${B.median_spread.toFixed(3)}, median top-of-book depth ${money(B.median_depth)}</p><div class="wrap"><table><tr><th>venue</th><th>family</th><th>market</th><th class="num">bid</th><th class="num">ask</th><th class="num">spread</th><th class="num">depth</th><th class="num">snaps</th></tr>${B.rows.map(r=>`<tr><td>${r.venue}</td><td>${r.family}</td><td>${r.market}</td><td class="num">${f(r.bid)}</td><td class="num">${f(r.ask)}</td><td class="num">${r.spread.toFixed(3)}</td><td class="num">${money(r.depth)}</td><td class="num">${r.snaps}</td></tr>`).join('')}</table></div>`:`<p class="small">${B.error||'no data'}</p>`;
const W=P.weather||{};const wx=W.sample?`<p class="small">${W.rows_today} strike snapshots today · ${W.markets} markets · ${W.cities} cities · last ${W.last}</p><div class="wrap"><table><tr><th>city</th><th>kind</th><th>date</th><th>strike</th><th class="num">yes bid</th><th class="num">yes ask</th><th class="num">GFS mean</th><th class="num">ECMWF mean</th></tr>${W.sample.map(r=>`<tr><td>${r.city}</td><td>${r.kind}</td><td>${r.target_date||''}</td><td class="mono">${r.strike_type||''}${r.strike??''}</td><td class="num">${f(r.yes_bid)}</td><td class="num">${f(r.yes_ask)}</td><td class="num">${r.gfs_mean==null?'':r.gfs_mean.toFixed(1)}</td><td class="num">${r.ecmwf_mean==null?'':r.ecmwf_mean.toFixed(1)}</td></tr>`).join('')}</table></div>`:`<p class="small">${W.error||'no data'}</p>`;
const A=P.paper_account||{};let acct='<p class="small">paper account not started</p>';
if(A.curve){const c=A.curve,W=860,H=220,L=56,R=16,T=14,B=30;const es=c.map(x=>x.e);const lo=Math.min(...es,A.start)-5,hi=Math.max(...es,A.start)+5;const x=i=>L+i/(Math.max(c.length-1,1))*(W-L-R),y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
const pts=c.map((p,i)=>`${x(i).toFixed(1)},${y(p.e).toFixed(1)}`).join(' ');const ticks=[lo+5,A.start,hi-5].filter((v,i,a)=>a.indexOf(v)===i);
const grid=ticks.map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="var(--line)"/><text x="${L-8}" y="${(y(v)+4).toFixed(1)}" text-anchor="end" class="mono" style="font-size:11px;fill:var(--muted)">$${v.toFixed(0)}</text>`).join('');
const svg=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;margin-top:8px" role="img" aria-label="Paper account equity">${grid}<line x1="${L}" x2="${W-R}" y1="${y(A.start).toFixed(1)}" y2="${y(A.start).toFixed(1)}" stroke="var(--muted)" stroke-dasharray="3 3"/><polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2"/><text x="${L}" y="${H-8}" class="mono" style="font-size:11px;fill:var(--muted)">${c[0].t.replace('T',' ')}</text><text x="${W-R}" y="${H-8}" text-anchor="end" class="mono" style="font-size:11px;fill:var(--muted)">${c[c.length-1].t.replace('T',' ')}</text></svg>`;
const pos=(A.positions||[]);acct=`<div class="tiles"><div class="tile"><div class="k ${A.pnl>=0?'ok':'bad'}">${money(A.equity)}</div><div class="l">equity (started $${A.start} on ${(A.created||'').slice(0,10)})</div></div><div class="tile"><div class="k ${A.pnl>=0?'ok':'bad'}">${(A.pnl>=0?'+':'')+money(A.pnl)} · ${(A.ret*100).toFixed(1)}%</div><div class="l">net P&L · realized ${money(A.realized)} · fees ${money(A.fees)}</div></div><div class="tile"><div class="k">${A.fills}</div><div class="l">graded fills (${A.pending_fills} pending) · informed share ${A.informed_share==null?'—':Math.round(A.informed_share*100)+'%'}</div></div><div class="tile"><div class="k">${money(A.exposure)}</div><div class="l">open exposure in ${pos.length} markets · max drawdown ${(A.max_dd*100).toFixed(1)}%</div></div></div>${svg}
<p class="small">Equity is marked to the current mid every minute; positions settle at 0 or 1 when Kalshi resolves the market. Fills come from real Kalshi prints hitting our resting quotes (a seller printing at or below our bid, a buyer at or above our ask), assuming we were first in the queue at that price.</p>
${pos.length?`<div class="wrap"><table><tr><th>market</th><th class="num">contracts (yes)</th><th class="num">avg</th><th class="num">mid</th><th class="num">unrealized</th></tr>${pos.map(r=>`<tr><td>${r.market}</td><td class="num">${r.q}</td><td class="num">${f(r.avg)}</td><td class="num">${f(r.mid)}</td><td class="num ${r.unreal>=0?'ok':'bad'}">${money(r.unreal)}</td></tr>`).join('')}</table></div>`:'<p class="small">no open positions</p>'}
${(A.recent_fills||[]).length?`<details><summary class="small">recent fills</summary><div class="wrap"><table><tr><th>time</th><th>market</th><th>side</th><th class="num">price</th><th class="num">contracts</th><th class="num">spread pnl</th><th class="num">adverse pnl</th><th>informed</th></tr>${A.recent_fills.map(r=>`<tr><td class="mono">${String(r.ts).slice(0,16).replace('T',' ')}</td><td>${r.market}</td><td>${r.side}</td><td class="num">${f(r.price)}</td><td class="num">${r.contracts}</td><td class="num">${money(r.spread_pnl)}</td><td class="num ${r.adverse_pnl>=0?'ok':'bad'}">${money(r.adverse_pnl)}</td><td>${r.informed?'yes':'no'}</td></tr>`).join('')}</table></div></details>`:''}`;}
const M=P.mm||{};const mmRows=M.rows||[];const paperRows=mmRows.filter(r=>r.status==='paper');const otherRows=mmRows.filter(r=>r.status!=='paper');
const mm=mmRows.length?`<p class="small">${paperRows.length} markets quoting on paper · ${(M.counts||{})['anchor pending']||0} logged until an anchor feed exists · ${(M.counts||{}).excluded||0} excluded. Quotes: anchor ±2.5¢, 1¢ skew toward the favourite, $200 per side, pulled 2h around any scheduled catalyst.</p>
<table class="fit"><tr><th>market</th><th>anchor</th><th class="num">fair</th><th class="num">ours bid–ask</th><th class="num">market bid–ask</th><th class="num">depth</th></tr>${paperRows.map(r=>{const src=/engine/i.test(r.anchor_source)?'engine':/ensemble/i.test(r.anchor_source)?'ensemble':/ESPN|Pinnacle/i.test(r.anchor_source)?'sharp line':/mid/i.test(r.anchor_source)?'mid':r.anchor_source;const c=v=>v==null||Number.isNaN(v)?'—':Math.round(v*100)+'¢';return `<tr><td class="mk">${r.venue==='kalshi'?'K':'P'} · ${r.market}</td><td class="small">${src}</td><td class="num">${c(r.anchor)}</td><td class="num ok">${c(r.our_bid)}–${c(r.our_ask)}</td><td class="num">${c(r.mkt_bid)}–${c(r.mkt_ask)}</td><td class="num">${money(r.depth)}</td></tr>`}).join('')}</table>
<details><summary class="small">pending and excluded (${otherRows.length})</summary><div class="wrap"><table><tr><th>venue</th><th>family</th><th>market</th><th>status</th><th>why</th></tr>${otherRows.map(r=>`<tr><td>${r.venue}</td><td>${r.family}</td><td>${r.market}</td><td><span class="pill ${r.status==='excluded'?'bad':''}">${r.status}</span></td><td class="small">${r.why||''}</td></tr>`).join('')}</table></div></details>`:'<p class="small">no market-making book yet</p>';
$('#app').innerHTML=`<div class="eyebrow">Octagon Edge · live status</div><h1>Status</h1><p class="small">data generated ${P.generated.replace('T',' ')} (${age} min ago) · page re-fetches every 5 min · <a href="#" id="lock">lock</a></p>
<div class="tiles">${paper}${led}<div class="tile"><div class="k ${P.jobs.every(j=>j.ok)?'ok':'bad'}">${P.jobs.filter(j=>j.ok).length}/${P.jobs.length}</div><div class="l">jobs healthy</div></div></div>
<h2>Paper account · historic performance</h2>${acct}
<h2>Market-making book</h2>${mm}
<h2>Jobs</h2><div class="wrap"><table><tr><th>job</th><th>state</th><th class="num">last heartbeat</th><th>detail</th></tr>${jobs}</table></div>
<h2>Paper bets · UFC opener strategy</h2>${(P.ledger||[]).length?`<div class="wrap"><table><tr><th>placed</th><th>event</th><th>fighter</th><th class="num">price</th><th>book</th><th class="num">implied</th><th class="num">model</th><th class="num">stake</th><th class="num">consensus now</th><th class="num">CLV</th><th>status</th><th class="num">P&L</th></tr>${P.ledger.map(r=>`<tr><td class="mono">${String(r.ts).replace('T',' ')}</td><td>${r.event}</td><td>${r.fighter}</td><td class="mono">${r.price}</td><td>${r.book}</td><td class="num">${f(r.implied)}</td><td class="num">${f(r.model)}</td><td class="num">$${r.stake}</td><td class="num">${f(r.consensus_now)}</td><td class="num ${r.clv>=0?'ok':'bad'}">${r.clv==null?'':(r.clv>0?'+':'')+(r.clv*100).toFixed(1)+' pts'}</td><td>${r.status}${r.result?' · '+r.result:''}</td><td class="num">${r.pnl==null||Number.isNaN(r.pnl)?'':money(r.pnl)}</td></tr>`).join('')}</table></div>`:'<p class="small">no paper bets yet</p>'}
<h2>Latest UFC scan</h2>${picks}<h2>Order-book logger</h2>${books}<h2>Weather logger</h2>${wx}`;
$('#lock').onclick=e=>{e.preventDefault();sessionStorage.removeItem('pw');localStorage.removeItem('pw');location.reload();};}
async function go(pw){try{const P=await load(pw);$('#gate').hidden=true;$('#app').hidden=false;render(P);sessionStorage.setItem('pw',pw);if($('#rem')&&$('#rem').checked)localStorage.setItem('pw',pw);setInterval(async()=>{try{render(await load(pw))}catch(e){}},300000);}catch(e){$('#err').textContent='Wrong passphrase or data unavailable.';$('#pw').value='';}}
$('#f').addEventListener('submit',e=>{e.preventDefault();go($('#pw').value)});const saved=localStorage.getItem('pw')||sessionStorage.getItem('pw');if(saved)go(saved);
</script></body></html>
