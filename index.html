<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Octagon Edge</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Source+Sans+3:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{--bg:#F2F4F7;--surface:#fff;--ink:#16212B;--muted:#5C6B78;--line:#D6DCE3;--accent:#C4162B;--good:#1F7A4D;--bad:#B23A2A;--tile:#EEF1F5}
@media (prefers-color-scheme:dark){:root{--bg:#0F1418;--surface:#171D23;--ink:#E9EDF0;--muted:#98A5B0;--line:#2B353E;--accent:#FF4D5E;--good:#4CC38A;--bad:#F07C6C;--tile:#1E262E}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Source Sans 3",system-ui,sans-serif;font-size:15px;line-height:1.45}
main{max-width:1000px;margin:0 auto;padding:20px 16px 60px}h1,h2,h3{font-family:"Barlow Condensed",sans-serif;margin:0}h3{font-size:17px;margin-top:14px;color:var(--muted)}h1{font-size:40px;line-height:1}h2{font-size:22px;margin-top:26px;padding-top:10px;border-top:2px solid var(--ink)}
.eyebrow{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}.mono{font-family:"JetBrains Mono",monospace;font-variant-numeric:tabular-nums}
@keyframes rowin{0%{opacity:0;transform:translateX(-14px);background:color-mix(in srgb,var(--accent) 28%,transparent)}12%{opacity:1;transform:none;background:color-mix(in srgb,var(--accent) 28%,transparent)}100%{background:transparent}}@keyframes rowchg{0%{background:color-mix(in srgb,var(--good) 30%,transparent)}100%{background:transparent}}tr.new td{animation:rowin 4s ease-out}tr.chg td{animation:rowchg 3s ease-out}@keyframes toastin{0%{opacity:0;transform:translateY(12px)}10%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0}}#toasts{position:fixed;right:16px;bottom:16px;z-index:60;display:flex;flex-direction:column;gap:8px;max-width:360px}.toast{background:var(--surface);color:var(--ink);border-left:4px solid var(--accent);padding:10px 12px;font-size:13px;box-shadow:0 6px 18px rgba(0,0,0,.25);animation:toastin 6s ease forwards}.toast b{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--accent);display:block;margin-bottom:2px}@keyframes pulse{0%{transform:scale(1)}30%{transform:scale(1.08)}100%{transform:scale(1)}}.tile.pulse .k{animation:pulse .8s ease}.tabs{display:flex;gap:4px;margin-top:14px;border-bottom:1px solid var(--line)}.tabs a{padding:8px 14px;font-family:"Barlow Condensed",sans-serif;font-size:17px;color:var(--muted);text-decoration:none;border-bottom:3px solid transparent;cursor:pointer}.tabs a.on{color:var(--ink);border-bottom-color:var(--accent)}tr.click{cursor:pointer}tr.click:hover td{background:color-mix(in srgb,var(--accent) 8%,transparent)}tr.sel td{background:color-mix(in srgb,var(--accent) 14%,transparent)}tr.detail td{background:var(--tile);padding:12px 14px}.dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:6px 18px;font-size:12.5px}.dl div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dotted var(--line);padding:3px 0}.dl span:first-child{color:var(--muted)}.dl span:last-child{font-family:"JetBrains Mono",monospace;text-align:right}.links{margin-top:10px;display:flex;gap:14px;flex-wrap:wrap}.links a{color:var(--accent);font-weight:600}#ff{width:100%;max-width:420px;font-size:14px;padding:8px 10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);margin-top:10px}.tile[data-tip]{cursor:help}th[data-tip]{text-decoration:underline dotted;text-underline-offset:3px;cursor:help}td[data-tip]{cursor:help}#tip{position:fixed;z-index:50;max-width:320px;background:var(--ink);color:var(--surface);font-size:12.5px;line-height:1.4;padding:8px 10px;border-radius:4px;box-shadow:0 4px 14px rgba(0,0,0,.25);pointer-events:none;white-space:normal}.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:16px}.tile{background:var(--tile);padding:12px 14px;border-left:3px solid var(--accent)}.tile .k{font-family:"JetBrains Mono",monospace;font-size:24px;font-weight:600}.tile .l{color:var(--muted);font-size:12px;margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:13px;background:var(--surface);margin-top:10px}table.fit{table-layout:fixed;font-size:12px}table.fit td,table.fit th{white-space:normal;padding:5px 6px;vertical-align:top;overflow-wrap:anywhere;word-break:normal}table.fit th{font-size:10.5px;letter-spacing:0;white-space:normal!important;line-height:1.2}table.fit td.mk{word-break:break-word}table.fit .num{white-space:nowrap}th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}.num{text-align:right;font-family:"JetBrains Mono",monospace;font-variant-numeric:tabular-nums}.wrap{overflow-x:auto}
.ok{color:var(--good);font-weight:600}.bad{color:var(--bad);font-weight:600}.pill{display:inline-block;padding:2px 8px;border-radius:3px;font-family:"JetBrains Mono",monospace;font-size:11px}.pill.ok{background:var(--good);color:#fff}.pill.bad{background:var(--bad);color:#fff}
#gate{max-width:420px;margin:80px auto;background:var(--surface);padding:28px;border:1px solid var(--line)}input{width:100%;font-size:16px;padding:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);margin:12px 0}button{font-size:15px;padding:10px 16px;background:var(--accent);color:#fff;border:0;cursor:pointer}button:focus,input:focus{outline:2px solid var(--accent);outline-offset:2px}
.small{color:var(--muted);font-size:12px}label{font-size:13px;color:var(--muted)}#err{color:var(--bad);min-height:1.2em}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
</style></head><body><main>
<div id="gate"><div class="eyebrow">Octagon Edge</div><h1>Status</h1><p class="small">This page is public but its data is encrypted. Enter the passphrase to decrypt it in your browser; nothing is sent anywhere.</p>
<form id="f"><label for="pw">Passphrase</label><input id="pw" type="password" autocomplete="current-password" autofocus><div class="row"><button type="submit">Unlock</button><label><input type="checkbox" id="rem" style="width:auto;margin:0 6px 0 0">remember on this device</label></div><div id="err"></div></form></div>
<div id="app" hidden></div>
</main>
<script>
const $=s=>document.querySelector(s);const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function decrypt(enc,pw){let k=KEYS[enc.salt];if(!k){const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);k=KEYS[enc.salt]=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(enc.salt),iterations:enc.iter,hash:'SHA-256'},key,{name:'AES-GCM',length:256},false,['decrypt']);}const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(enc.iv)},k,b64(enc.ct));if(enc.gz){const txt=await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream('gzip'))).text();return JSON.parse(txt);}return JSON.parse(new TextDecoder().decode(pt));}
const LOCAL=/^(127\.0\.0\.1|localhost)$/.test(location.hostname);let CUR=null,LASTUPD=0,MODE='github',ES=null,KEYS={};
async function loadGithub(pw){const r=await fetch('status.enc.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('status file missing');return decrypt(await r.json(),pw);}
async function fetchAttachment(att){const r=await fetch(att.url,{cache:'no-store'});if(/\.gz$/.test(att.name||'')||att.type==='application/gzip'){const ds=new DecompressionStream('gzip');const txt=await new Response(r.body.pipeThrough(ds)).text();return JSON.parse(txt);}return r.json();}
async function token(pw){const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('octagon-live:'+pw));return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('');}
async function loadLocal(pw){const r=await fetch('/status?t='+await token(pw),{cache:'no-store'});if(!r.ok)throw new Error('local server');return decrypt(await r.json(),pw);}
async function load(pw){if(LOCAL){try{const P=await loadLocal(pw);MODE='live';return P;}catch(e){}}MODE='github';return loadGithub(pw);}
function applyFast(F){if(!CUR)return;const A=CUR.paper_account=CUR.paper_account||{};if(F.acct){A.equity=F.acct.eq;A.cash=F.acct.cash;A.realized=F.acct.real;A.fees=F.acct.fees;A.pending_fills=F.acct.pend;A.pnl=+(F.acct.eq-(A.start||1000)).toFixed(2);A.ret=A.equity/(A.start||1000)-1;const old=Object.fromEntries((A.positions||[]).map(p=>[String(p.ticker).slice(-14),p]));A.positions=F.acct.pos.map(([t,q,avg,mid])=>{const o=old[t]||{};return {ticker:t,market:o.market||t,q,avg,mid,unreal:+((q*((mid==null?avg:mid)-avg))).toFixed(2)}});A.exposure=+A.positions.reduce((s,p)=>s+Math.abs(p.q)*(p.mid==null?p.avg:p.mid),0).toFixed(2);if(A.curve&&A.curve.length){const last=A.curve[A.curve.length-1];const t=(F.g||'').slice(0,16);if(last.t!==t)A.curve.push({t,e:A.equity,c:A.cash});else{last.e=A.equity;last.c=A.cash}}}
if(F.q&&CUR.mm&&CUR.mm.rows){for(const [mk,b,a,mb,ma] of F.q){const r=CUR.mm.rows.find(x=>x.status==='paper'&&String(x.market).slice(0,28)===mk);if(r){r.our_bid=b;r.our_ask=a;r.mkt_bid=mb;r.mkt_ask=ma;}}}
if(F.led){CUR.gates=CUR.gates||{};CUR.gates.ledger={...(CUR.gates.ledger||{}),bets:F.led.n,open:F.led.open,mean_clv:F.led.clv,settled:F.led.settled,pnl:F.led.pnl,graded:F.led.n};if(CUR.ledger)for(const [name,cons,clv,st] of F.led.rows){const r=CUR.ledger.find(x=>String(x.fighter).slice(0,22)===name);if(r){r.consensus_now=cons;r.clv=clv;r.status=st;}}}
if(F.hb&&CUR.jobs)for(const j of CUR.jobs){if(j.job in F.hb){j.ok=!!F.hb[j.job];if(j.ok)j.age_min=0;}}CUR.generated=F.g||CUR.generated;}
async function startLive(pw){if(!LOCAL)return;const t=await token(pw);const open=()=>{if(ES)ES.close();ES=new EventSource('/sse?t='+t);ES.onmessage=async e=>{try{CUR=await decrypt(JSON.parse(e.data),pw);LASTUPD=Date.now();MODE='live';render(CUR);}catch(err){}};ES.onerror=()=>{MODE='github';};};open();
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){if(!ES||ES.readyState===2)open();}else if(ES){ES.close();ES=null;}});setInterval(()=>{const el=document.getElementById('upd');if(el&&LASTUPD)el.textContent=Math.round((Date.now()-LASTUPD)/1000)+'s ago';},1000);}
const f=v=>v==null||Number.isNaN(v)?'':(typeof v==='number'?(Math.abs(v)<10?v.toFixed(3):v.toLocaleString(undefined,{maximumFractionDigits:0})):String(v));
const px=v=>{if(v==null||Number.isNaN(v))return '';const n=+v;return '$'+(Math.round(n*1000)%10?n.toFixed(3):n.toFixed(2));};
const money=v=>v==null||Number.isNaN(v)?'':(v<0?'−$':'$')+Math.abs(v).toLocaleString(undefined,Math.abs(v)<100?{minimumFractionDigits:2,maximumFractionDigits:2}:{maximumFractionDigits:0});
function tips(){document.querySelectorAll('[title]').forEach(el=>{el.dataset.tip=el.title;el.removeAttribute('title');});document.querySelectorAll('table').forEach(t=>{const hs=[...t.querySelectorAll('tr:first-child th')];t.querySelectorAll('tr').forEach(tr=>[...tr.children].forEach((td,i)=>{if(hs[i]&&hs[i].dataset.tip&&!td.dataset.tip)td.dataset.tip=hs[i].dataset.tip;}));});}
let TAB='overview',SELECTED=null,FILTER='',PENDING=null;
const et=(ts,sec)=>{const d=new Date(ts);if(isNaN(d))return String(ts||'');return d.toLocaleString('en-US',{timeZone:'America/New_York',month:'short',day:'numeric',hour:'numeric',minute:'2-digit',...(sec?{second:'2-digit'}:{})})+' ET'};
const cdText=(iso,fin)=>{if(fin&&+fin)return 'final';if(!iso)return '—';const ms=new Date(iso)-Date.now();if(isNaN(ms))return '—';if(ms<=0)return 'settling…';const s=Math.floor(ms/1000),d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),c=s%60,p=n=>String(n).padStart(2,'0');return (d?d+'d ':'')+(d||h?h+'h ':'')+p(m)+'m '+p(c)+'s';};setInterval(()=>document.querySelectorAll('[data-exp]').forEach(el=>{el.textContent=cdText(el.dataset.exp,el.dataset.final);}),1000);
const fkey=r=>`fill|${r.ts}|${r.ticker}|${r.side}|${r.price}`;
function openFill(k){TAB='fills';SELECTED=k;render(CUR);setTimeout(()=>{const el=document.querySelector('tr.sel');if(el)el.scrollIntoView({block:'center',behavior:'smooth'});},50);}
function applyFilter(){const q=FILTER.trim().toLowerCase();document.querySelectorAll('#fl tr[data-fk]').forEach(tr=>{const hit=!q||tr.textContent.toLowerCase().includes(q);tr.hidden=!hit;const d=tr.nextElementSibling;if(d&&d.classList.contains('detail'))d.hidden=!hit;});}
function fillDetail(r,meta){const size=r.contracts*r.price;const settled=r.result?`settled ${String(r.result).toUpperCase()}${r.settled_at?' at '+et(r.settled_at):''}`:(meta&&meta.mid!=null?`open · current mid ${px(meta.mid)}`:'open');const venue=r.venue==='polymarket'?'Polymarket':'Kalshi';const rows=[['time',et(r.ts,true)],['time (UTC)',String(r.ts).replace('T',' ').slice(0,19)+'Z'],['venue',venue],['market',r.market],['ticker',r.ticker],['family',r.family||''],['side',r.side==='bid'?'bid · someone sold to us, we bought YES':'ask · someone bought from us, we sold YES'],['price',px(r.price)],['contracts',(+r.contracts).toFixed(2)],['$ size',money(size)],['mark now (mid, or $1/$0 if settled)',px(r.mark)],['P&L before fee',money(r.pnl_gross)],['fee',money(r.fee)],['P&L now (net)',(r.pnl_net>=0?'+':'')+money(r.pnl_net)],['our fair value then',px(r.anchor)],['edge vs our fair value (unrealized)',money(r.spread_pnl)],['maker reward',money(r.reward)],['mid 10 min later',px(r.mid_10m)],['10-min move',money(r.adverse_pnl)],['verdict',r.pending?'still grading (under 10 min old)':(r.informed?'informed (moved ≥2¢ against us)':'uninformed')],['market status',settled]];
const links=[r.url?`<a href="${r.url}" target="_blank" rel="noopener">open on ${venue} ↗</a>`:'',r.url&&r.result?`<a href="${r.url}" target="_blank" rel="noopener">result on ${venue} ↗</a>`:''].filter(Boolean).join('');
return `<tr class="detail"><td colspan="12"><div class="dl">${rows.map(([k,v])=>`<div><span>${k}</span><span>${v==null?'':v}</span></div>`).join('')}</div><div class="links">${links||'<span class="small">no venue link available</span>'}</div></td></tr>`;}
function fillsView(P){const all=(P.fills_all||[]).slice().reverse();const pm=P.positions_meta||{};const posMid=Object.fromEntries(((P.paper_account||{}).positions||[]).map(p=>[p.ticker,p]));if(!all.length)return '<p class="small">no fills yet</p>';
const rows=all.map(r=>{const k=fkey(r);const sel=k===SELECTED;return `<tr class="click${sel?' sel':''}" data-fk="${k}"><td class="mono">${et(r.ts)}</td><td>${r.venue==='polymarket'?'P':'K'}</td><td>${r.market}</td><td>${r.side==='bid'?'bought':'sold'}</td><td class="num">${px(r.price)}</td><td class="num">${(+r.contracts).toFixed(1)}</td><td class="num">${money(r.contracts*r.price)}</td><td class="num">${px(r.mark)}</td><td class="num ${r.pnl_net>=0?'ok':'bad'}">${(r.pnl_net>=0?'+':'')+money(r.pnl_net)}</td><td class="num">${money(r.spread_pnl)}</td><td class="${r.pending?'':(r.informed?'bad':'ok')}">${r.pending?'grading':(r.informed?'informed':'uninformed')}</td><td>${r.result?String(r.result).toUpperCase():'open'}</td><td class="num mono" data-exp="${r.expires||''}" data-final="${r.final?1:0}">${cdText(r.expires,${r.final?1:0})}</td></tr>${sel?fillDetail(r,posMid[r.ticker]):''}`;}).join('');
const rc=P.fills_recon||{};return `<h2>All fills</h2><p class="small">${all.length} fills, newest first, Eastern time. Click a row for every detail and a link to the market on the venue.</p><div class="tiles"><div class="tile" data-tip="Sum of P&L now across every fill, before fees. Bought: (mark − price) × contracts; sold: (price − mark) × contracts."><div class="k ${rc.gross>=0?'ok':'bad'}">${(rc.gross>=0?'+':'')+money(rc.gross)}</div><div class="l">P&L on ${rc.n} fills before fees</div></div><div class="tile" data-tip="Exchange trading fees paid on these fills."><div class="k">−${money(rc.fees)}</div><div class="l">fees</div></div><div class="tile" data-tip="Before-fees P&L minus fees. This equals the account P&L on the Overview tab (equity − $1,000)."><div class="k ${rc.net>=0?'ok':'bad'}">${(rc.net>=0?'+':'')+money(rc.net)}</div><div class="l">net = account P&L</div></div><div class="tile" data-tip="Fills whose market has settled, so their P&L is final. Everything else is still marked to the market mid."><div class="k">${rc.settled||0} / ${rc.n||0}</div><div class="l">fills final (settled) · ${rc.pending||0} still grading</div></div></div><input id="ff" placeholder="filter by market, venue letter, side, verdict…" value="${FILTER.replace(/"/g,'&quot;')}"><div class="wrap"><table class="fit"><tr><th title="Eastern time of the fill.">time</th><th title="K = Kalshi, P = Polymarket">venue</th><th>market</th><th title="bought = we now hold YES; sold = we are short YES.">we</th><th class="num" title="Fill price per contract.">price</th><th class="num">contracts</th><th class="num" title="Contracts × price.">$ size</th><th class="num" title="Market mid now, or $1 / $0 once settled.">mark now</th><th class="num" title="Profit or loss on this fill so far, after the fee. Adds up to the account P&L.">P&L now</th><th class="num" title="Fill price vs our own fair value at the time, × contracts. A model claim, not money, until settlement proves it.">edge vs our fair</th><th title="informed = market moved ≥2¢ against us within 10 min; grading = fill is younger than 10 min.">verdict</th><th title="open = marked to market; YES / NO = settled result.">result</th><th class="num" title="Countdown to when the venue is expected to settle this market and pay out. Counts down live.">resolves in</th></tr>${rows}</table></div>`;}
document.addEventListener('click',e=>{const t=e.target.closest('[data-tab]');if(t){e.preventDefault();TAB=t.dataset.tab;render(CUR);return;}if(e.target.closest('a[href]'))return;const rf=e.target.closest('tr[data-fk]');if(rf){SELECTED=SELECTED===rf.dataset.fk?null:rf.dataset.fk;render(CUR);return;}const rr=e.target.closest('tr[data-key^="fill|"]');if(rr)openFill(rr.dataset.key);});
document.addEventListener('input',e=>{if(e.target.id==='ff'){FILTER=e.target.value;applyFilter();}});document.addEventListener('focusout',e=>{if(e.target.id==='ff'&&PENDING){const P=PENDING;PENDING=null;render(P);}});
let SEEN=null,QMAP={};function toast(kind,msg){let c=document.getElementById('toasts');if(!c){c=document.createElement('div');c.id='toasts';document.body.appendChild(c);}const d=document.createElement('div');d.className='toast';d.innerHTML='<b>'+kind+'</b>'+msg;c.appendChild(d);setTimeout(()=>d.remove(),6000);while(c.children.length>4)c.firstChild.remove();}
function animateNew(){const rows=[...document.querySelectorAll('tr[data-key]')];const keys=new Set(rows.map(r=>r.dataset.key));if(SEEN){let nf=0,np=0;for(const r of rows){const k=r.dataset.key;if(!SEEN.has(k)){r.classList.add('new');if(k.startsWith('fill|')){nf++;if(nf<=3)toast('fill',r.dataset.desc||'');}else if(k.startsWith('pos|')){np++;toast('new position',r.children[0].textContent);}}else if(k.startsWith('pos|')&&QMAP[k]!==undefined&&QMAP[k]!==r.dataset.q){r.classList.add('chg');}}if(nf>3)toast('fills','+'+(nf-3)+' more');if(nf||np){document.querySelectorAll('.tile').forEach(t=>{if(/fills graded|open exposure/.test(t.textContent))t.classList.add('pulse');});}}SEEN=keys;for(const r of rows)if(r.dataset.key.startsWith('pos|'))QMAP[r.dataset.key]=r.dataset.q;}
let TIP=null;function showTip(el,x,y){if(!TIP){TIP=document.createElement('div');TIP.id='tip';document.body.appendChild(TIP);}TIP.textContent=el.dataset.tip;TIP.hidden=false;const w=TIP.offsetWidth,h=TIP.offsetHeight;let left=x+14,top=y+18;if(left+w>window.innerWidth-8)left=Math.max(8,x-w-14);if(top+h>window.innerHeight-8)top=Math.max(8,y-h-14);TIP.style.left=left+'px';TIP.style.top=top+'px';}
function hideTip(){if(TIP)TIP.hidden=true;}
document.addEventListener('mouseover',e=>{const el=e.target.closest('[data-tip]');if(el)showTip(el,e.clientX,e.clientY);else hideTip();});document.addEventListener('mousemove',e=>{const el=e.target.closest('[data-tip]');if(el&&TIP&&!TIP.hidden)showTip(el,e.clientX,e.clientY);});document.addEventListener('mouseout',e=>{if(!e.relatedTarget||!e.relatedTarget.closest||!e.relatedTarget.closest('[data-tip]'))hideTip();});document.addEventListener('click',e=>{if(e.target.closest('tr.click,tr[data-key^="fill|"]'))return;const el=e.target.closest('[data-tip]');if(el){if(TIP&&!TIP.hidden&&TIP.textContent===el.dataset.tip)hideTip();else showTip(el,e.clientX,e.clientY);}});
