<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Octagon Edge</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Source+Sans+3:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{--bg:#F2F4F7;--surface:#fff;--ink:#16212B;--muted:#5C6B78;--line:#D6DCE3;--accent:#C4162B;--good:#1F7A4D;--bad:#B23A2A;--tile:#EEF1F5}
@media (prefers-color-scheme:dark){:root{--bg:#0F1418;--surface:#171D23;--ink:#E9EDF0;--muted:#98A5B0;--line:#2B353E;--accent:#FF4D5E;--good:#4CC38A;--bad:#F07C6C;--tile:#1E262E}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Source Sans 3",system-ui,sans-serif;font-size:15px;line-height:1.45}
main{max-width:1560px;margin:0 auto;padding:20px 24px 60px}h1,h2,h3{font-family:"Barlow Condensed",sans-serif;margin:0}h3{font-size:17px;margin-top:14px;color:var(--muted)}h1{font-size:40px;line-height:1}h2{font-size:22px;margin-top:26px;padding-top:10px;border-top:2px solid var(--ink)}
.eyebrow{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}.mono{font-family:"JetBrains Mono",monospace;font-variant-numeric:tabular-nums}
@keyframes rowin{0%{opacity:0;transform:translateX(-14px);background:color-mix(in srgb,var(--accent) 28%,transparent)}12%{opacity:1;transform:none;background:color-mix(in srgb,var(--accent) 28%,transparent)}100%{background:transparent}}@keyframes rowchg{0%{background:color-mix(in srgb,var(--good) 30%,transparent)}100%{background:transparent}}tr.new td{animation:rowin 4s ease-out}tr.chg td{animation:rowchg 3s ease-out}@keyframes toastin{0%{opacity:0;transform:translateY(12px)}10%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0}}#toasts{position:fixed;right:16px;bottom:16px;z-index:60;display:flex;flex-direction:column;gap:8px;max-width:360px}.toast{background:var(--surface);color:var(--ink);border-left:4px solid var(--accent);padding:10px 12px;font-size:13px;box-shadow:0 6px 18px rgba(0,0,0,.25);animation:toastin 6s ease forwards}.toast b{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--accent);display:block;margin-bottom:2px}@keyframes pulse{0%{transform:scale(1)}30%{transform:scale(1.08)}100%{transform:scale(1)}}.tile.pulse .k{animation:pulse .8s ease}.sbar{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;font-size:13px;color:var(--muted);margin-top:14px}.sbar a{color:var(--accent)}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin-right:6px;vertical-align:1px}.dot.ok{background:var(--good)}.dot.bad{background:var(--bad)}.cards{display:grid;grid-template-columns:1fr;gap:14px;margin-top:12px}.card{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--accent);padding:16px 18px}.ch{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}.ct{font-family:"Barlow Condensed",sans-serif;font-size:20px;font-weight:600}.hero{font-family:"JetBrains Mono",monospace;font-size:38px;font-weight:700;margin-top:8px;line-height:1.1}.hl{color:var(--muted);font-size:12.5px;margin-top:2px}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px 14px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}.st{display:flex;flex-direction:column;cursor:help}.sl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}.sv{font-family:"JetBrains Mono",monospace;font-size:15px;margin-top:2px}.gate{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);max-width:720px}.gl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}.gr{display:grid;grid-template-columns:110px 1fr 140px;gap:10px;align-items:center;font-size:12.5px;margin-top:6px;cursor:help}.gv{font-family:"JetBrains Mono",monospace;font-size:12px;text-align:right;color:var(--muted)}.bar{height:7px;background:var(--tile);border-radius:2px;overflow:hidden}.bar span{display:block;height:100%;background:var(--accent)}.bar span.g{background:var(--good)}.bar span.b{background:var(--bad)}.card.retired{border-top-color:var(--muted);margin-top:12px}.card.retired .hero{font-size:28px}.rgrid{display:grid;grid-template-columns:1fr minmax(240px,420px);gap:18px;align-items:center}@media(max-width:700px){.rgrid{grid-template-columns:1fr}}.chart-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:16px}details.how{margin-top:10px}details.how summary{cursor:pointer;font-size:12.5px;color:var(--muted)}tr.tot td{font-weight:600;border-top:2px solid var(--ink);background:var(--tile)}.tabs{display:flex;gap:4px;margin-top:14px;border-bottom:1px solid var(--line)}.tabs a{padding:8px 14px;font-family:"Barlow Condensed",sans-serif;font-size:17px;color:var(--muted);text-decoration:none;border-bottom:3px solid transparent;cursor:pointer}.tabs a.on{color:var(--ink);border-bottom-color:var(--accent)}tr.click{cursor:pointer}tr.click:hover td{background:color-mix(in srgb,var(--accent) 8%,transparent)}tr.sel td{background:color-mix(in srgb,var(--accent) 14%,transparent)}tr.detail td{background:var(--tile);padding:14px 14px 12px}.dgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}@media(max-width:1000px){.dgrid{grid-template-columns:1fr}}.dg{background:var(--surface);border:1px solid var(--line);padding:10px 14px 6px;min-width:0}.dg h4{font-family:"Barlow Condensed",sans-serif;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px;font-weight:600;border-bottom:1px solid var(--line);padding-bottom:6px}.dg div{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:5px 0;border-bottom:1px dotted var(--line);font-size:12.5px}.dg div:last-child{border-bottom:0}.dg div span:first-child{color:var(--muted);flex:0 0 auto}.dg div span:last-child{font-family:"JetBrains Mono",monospace;text-align:right;white-space:nowrap;min-width:0}.dg div span.wrap{white-space:normal;overflow-wrap:anywhere;font-family:inherit}.dg div span.ok,.dg div span.bad{font-weight:600}.links{margin-top:12px;display:flex;gap:18px;flex-wrap:wrap;justify-content:flex-end}.links a{color:var(--accent);font-weight:600}#ff{width:100%;max-width:420px;font-size:14px;padding:8px 10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);margin-top:10px}.tile[data-tip]{cursor:help}th[data-tip]{text-decoration:underline dotted;text-underline-offset:3px;cursor:help}td[data-tip]{cursor:help}#tip{position:fixed;z-index:50;max-width:340px;background:var(--ink);color:var(--surface);font-size:12.5px;line-height:1.4;padding:8px 10px;border-radius:4px;box-shadow:0 4px 14px rgba(0,0,0,.25);pointer-events:none;white-space:normal}.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:16px}.tile{background:var(--tile);padding:12px 14px;border-left:3px solid var(--accent)}.tile .k{font-family:"JetBrains Mono",monospace;font-size:24px;font-weight:600}.tile .l{color:var(--muted);font-size:12px;margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:13px;background:var(--surface);margin-top:10px}table.fit{table-layout:fixed;font-size:12px}table.fit td,table.fit th{white-space:normal;padding:5px 6px;vertical-align:top;overflow-wrap:anywhere;word-break:normal}table.fit th{font-size:10.5px;letter-spacing:0;white-space:normal!important;line-height:1.2}table.fit{table-layout:auto}td[data-exp]{white-space:nowrap;min-width:9.5em}table.fit td.num,table.fit td.mono{white-space:nowrap}table.fit td.mk,table.fit td:nth-child(2){white-space:normal}table.fit td.mk{word-break:break-word}table.fit .num{white-space:nowrap}th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}.num{text-align:right;font-family:"JetBrains Mono",monospace;font-variant-numeric:tabular-nums}.wrap{overflow-x:auto}
.ok{color:var(--good);font-weight:600}.bad{color:var(--bad);font-weight:600}.pill{display:inline-block;padding:2px 8px;border-radius:3px;font-family:"JetBrains Mono",monospace;font-size:11px}.pill.ok{background:var(--good);color:#fff}.pill.bad{background:var(--bad);color:#fff}
#gate{max-width:420px;margin:80px auto;background:var(--surface);padding:28px;border:1px solid var(--line)}input{width:100%;font-size:16px;padding:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);margin:12px 0}button{font-size:15px;padding:10px 16px;background:var(--accent);color:#fff;border:0;cursor:pointer}button:focus,input:focus{outline:2px solid var(--accent);outline-offset:2px}
.small{color:var(--muted);font-size:12px}label{font-size:13px;color:var(--muted)}#err{color:var(--bad);min-height:1.2em}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
</style></head><body><main>
<div id="gate"><div class="eyebrow">Octagon Edge</div><h1>Status</h1><p class="small">This page is public but its data is encrypted. Enter the passphrase to decrypt it in your browser; nothing is sent anywhere.</p>
<form id="f"><label for="pw">Passphrase</label><input id="pw" type="password" autocomplete="current-password" autofocus><div class="row"><button type="submit">Unlock</button><label><input type="checkbox" id="rem" style="width:auto;margin:0 6px 0 0">remember on this device</label></div><div id="err"></div></form></div>
<div id="app" hidden></div>
</main>
<script>
const $=s=>document.querySelector(s);const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function decrypt(enc,pw){let k=KEYS[enc.salt];if(!k){const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);k=KEYS[enc.salt]=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(enc.salt),iterations:enc.iter,hash:'SHA-256'},key,{name:'AES-GCM',length:256},false,['decrypt']);}const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(enc.iv)},k,b64(enc.ct));if(enc.gz){const txt=await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream('gzip'))).text();return JSON.parse(txt);}return JSON.parse(new TextDecoder().decode(pt));}
const LOCAL=/^(127\.0\.0\.1|localhost)$/.test(location.hostname);let CUR=null,LASTUPD=0,MODE='github',ES=null,KEYS={};
async function loadGithub(pw){const r=await fetch('status.enc.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('status file missing');return decrypt(await r.json(),pw);}
async function fetchAttachment(att){const r=await fetch(att.url,{cache:'no-store'});if(/\.gz$/.test(att.name||'')||att.type==='application/gzip'){const ds=new DecompressionStream('gzip');const txt=await new Response(r.body.pipeThrough(ds)).text();return JSON.parse(txt);}return r.json();}
async function token(pw){const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('octagon-live:'+pw));return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('');}
async function loadLocal(pw){const r=await fetch('/status?t='+await token(pw),{cache:'no-store'});if(!r.ok)throw new Error('local server');return decrypt(await r.json(),pw);}
async function load(pw){if(LOCAL){try{const P=await loadLocal(pw);MODE='live';return P;}catch(e){}}MODE='github';return loadGithub(pw);}
function applyFast(F){if(!CUR)return;const A=CUR.paper_account=CUR.paper_account||{};if(F.acct){A.equity=F.acct.eq;A.cash=F.acct.cash;A.realized=F.acct.real;A.fees=F.acct.fees;A.pending_fills=F.acct.pend;A.pnl=+(F.acct.eq-(A.start||1000)).toFixed(2);A.ret=A.equity/(A.start||1000)-1;const old=Object.fromEntries((A.positions||[]).map(p=>[String(p.ticker).slice(-14),p]));A.positions=F.acct.pos.map(([t,q,avg,mid])=>{const o=old[t]||{};return {ticker:t,market:o.market||t,q,avg,mid,unreal:+((q*((mid==null?avg:mid)-avg))).toFixed(2)}});A.exposure=+A.positions.reduce((s,p)=>s+Math.abs(p.q)*(p.mid==null?p.avg:p.mid),0).toFixed(2);if(A.curve&&A.curve.length){const last=A.curve[A.curve.length-1];const t=(F.g||'').slice(0,16);if(last.t!==t)A.curve.push({t,e:A.equity,c:A.cash});else{last.e=A.equity;last.c=A.cash}}}
if(F.q&&CUR.mm&&CUR.mm.rows){for(const [mk,b,a,mb,ma] of F.q){const r=CUR.mm.rows.find(x=>x.status==='paper'&&String(x.market).slice(0,28)===mk);if(r){r.our_bid=b;r.our_ask=a;r.mkt_bid=mb;r.mkt_ask=ma;}}}
if(F.led){CUR.gates=CUR.gates||{};CUR.gates.ledger={...(CUR.gates.ledger||{}),bets:F.led.n,open:F.led.open,mean_clv:F.led.clv,settled:F.led.settled,pnl:F.led.pnl,graded:F.led.n};if(CUR.ledger)for(const [name,cons,clv,st] of F.led.rows){const r=CUR.ledger.find(x=>String(x.fighter).slice(0,22)===name);if(r){r.consensus_now=cons;r.clv=clv;r.status=st;}}}
if(F.hb&&CUR.jobs)for(const j of CUR.jobs){if(j.job in F.hb){j.ok=!!F.hb[j.job];if(j.ok)j.age_min=0;}}CUR.generated=F.g||CUR.generated;}
async function startLive(pw){if(!LOCAL)return;const t=await token(pw);const open=()=>{if(ES)ES.close();ES=new EventSource('/sse?t='+t);ES.onmessage=async e=>{try{CUR=await decrypt(JSON.parse(e.data),pw);LASTUPD=Date.now();MODE='live';render(CUR);}catch(err){}};ES.onerror=()=>{MODE='github';};};open();
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){if(!ES||ES.readyState===2)open();}else if(ES){ES.close();ES=null;}});setInterval(()=>{const el=document.getElementById('upd');if(el&&LASTUPD)el.textContent=Math.round((Date.now()-LASTUPD)/1000)+'s ago';},1000);}
const f=v=>v==null||Number.isNaN(v)?'':(typeof v==='number'?(Math.abs(v)<10?v.toFixed(3):v.toLocaleString(undefined,{maximumFractionDigits:0})):String(v));
const px=v=>{if(v==null||Number.isNaN(v))return '';const n=+v;return '$'+(Math.round(n*1000)%10?n.toFixed(3):n.toFixed(2));};
const money=v=>v==null||Number.isNaN(v)?'':(v<0?'−$':'$')+Math.abs(v).toLocaleString(undefined,Math.abs(v)<100?{minimumFractionDigits:2,maximumFractionDigits:2}:{maximumFractionDigits:0});
function tips(){document.querySelectorAll('[title]').forEach(el=>{el.dataset.tip=el.title;el.removeAttribute('title');});document.querySelectorAll('table').forEach(t=>{const hs=[...t.querySelectorAll('tr:first-child th')];t.querySelectorAll('tr').forEach(tr=>[...tr.children].forEach((td,i)=>{if(hs[i]&&hs[i].dataset.tip&&!td.dataset.tip)td.dataset.tip=hs[i].dataset.tip;}));});}
let TAB='overview',SELECTED=null,FILTER='',PENDING=null;
const et=(ts,sec)=>{const d=new Date(ts);if(isNaN(d))return String(ts||'');return d.toLocaleString('en-US',{timeZone:'America/New_York',month:'short',day:'numeric',hour:'numeric',minute:'2-digit',...(sec?{second:'2-digit'}:{})})+' ET'};
const cdText=(iso,fin)=>{if(fin&&+fin)return 'final';if(!iso)return '—';const ms=new Date(iso)-Date.now();if(isNaN(ms))return '—';if(ms<=0)return 'settling…';const s=Math.floor(ms/1000),d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),c=s%60,p=n=>String(n).padStart(2,'0');return (d?d+'d ':'')+(d||h?h+'h ':'')+p(m)+'m '+p(c)+'s';};setInterval(()=>document.querySelectorAll('[data-exp]').forEach(el=>{el.textContent=cdText(el.dataset.exp,el.dataset.final);}),1000);
const fkey=r=>`fill|${r.ts}|${r.ticker}|${r.side}|${r.price}`;
function openFill(k){TAB='fills';SELECTED=k;render(CUR);setTimeout(()=>{const el=document.querySelector('tr.sel');if(el)el.scrollIntoView({block:'center',behavior:'smooth'});},50);}
function applyFilter(){const q=FILTER.trim().toLowerCase();document.querySelectorAll('#fl tr[data-fk]').forEach(tr=>{const hit=!q||tr.textContent.toLowerCase().includes(q);tr.hidden=!hit;const d=tr.nextElementSibling;if(d&&d.classList.contains('detail'))d.hidden=!hit;});}
function fillDetail(r,meta){const size=r.contracts*r.price;const venue=r.venue==='polymarket'?'Polymarket':'Kalshi';const settled=r.result?`settled ${String(r.result).toUpperCase()}${r.settled_at?' at '+et(r.settled_at):''}`:(meta&&meta.mid!=null?`open · mid ${px(meta.mid)}`:'open');const sgn=v=>(v>=0?'+':'')+money(v);
const row=(k,v,cls)=>`<div><span>${k}</span><span class="${cls||''}">${v==null?'':v}</span></div>`;
const g1=`<div class="dg"><h4>The trade</h4>${row('when',et(r.ts,true))}${row('UTC',String(r.ts).replace('T',' ').slice(0,19)+'Z')}${row('venue',venue)}${row('market',r.market,'wrap')}${row('ticker',r.ticker,'wrap')}${row('family',r.family||'')}${row('we',r.side==='bid'?'bought YES (someone sold to us)':'sold YES (someone bought from us)','wrap')}${r.kind==='flatten'?row('kind','flatten: we crossed the spread to cut inventory','wrap'):''}${row('price',px(r.price))}${row('contracts',(+r.contracts).toFixed(2))}${row('$ size',money(size))}${row('fee',money(r.fee))}</div>`;
const g2=`<div class="dg"><h4>Where it stands</h4>${row('mark now',px(r.mark)+(r.final?' (settled)':' (market mid)'))}${row('P&L before fee',sgn(r.pnl_gross))}${row('P&L now, net',sgn(r.pnl_net),r.pnl_net>=0?'ok':'bad')}${row('status',settled,'wrap')}${row('resolves in',`<span data-exp="${r.expires||''}" data-final="${r.final?1:0}">${cdText(r.expires,r.final)}</span>`)}</div>`;
const g3=`<div class="dg"><h4>Model view (not money)</h4>${row('our fair value then',px(r.anchor))}${row('edge vs our fair',money(r.spread_pnl))}${row('mid 10 min later',px(r.mid_10m))}${row('10-min move',r.adverse_pnl==null?'grading':sgn(r.adverse_pnl),r.adverse_pnl==null?'':(r.adverse_pnl>=0?'ok':'bad'))}${row('verdict',r.pending?'still grading':(r.informed?'informed (moved ≥2¢ against us)':'uninformed'),r.pending?'':(r.informed?'bad':'ok'))}${row('maker reward',money(r.reward))}</div>`;
const links=[r.url?`<a href="${r.url}" target="_blank" rel="noopener">open on ${venue} ↗</a>`:'',r.url&&r.result?`<a href="${r.url}" target="_blank" rel="noopener">result on ${venue} ↗</a>`:''].filter(Boolean).join('');
return `<tr class="detail"><td colspan="12"><div class="dgrid">${g1}${g2}${g3}</div><div class="links">${links||'<span class="small">no venue link available</span>'}</div></td></tr>`;}
function fillsView(P){const all=(P.fills_all||[]).slice().reverse();const pm=P.positions_meta||{};const posMid=Object.fromEntries(((P.paper_account||{}).positions||[]).map(p=>[p.ticker,p]));if(!all.length)return '<p class="small">no fills yet</p>';
const rows=all.map(r=>{const k=fkey(r);const sel=k===SELECTED;return `<tr class="click${sel?' sel':''}" data-fk="${k}"><td class="mono">${et(r.ts)}</td><td>${r.venue==='polymarket'?'P':'K'}</td><td>${r.market}</td><td>${r.side==='bid'?'bought':'sold'}${r.kind==='flatten'?' <span class="pill">flatten</span>':''}</td><td class="num">${px(r.price)}</td><td class="num">${(+r.contracts).toFixed(1)}</td><td class="num">${money(r.contracts*r.price)}</td><td class="num">${px(r.mark)}</td><td class="num ${r.pnl_net>=0?'ok':'bad'}">${(r.pnl_net>=0?'+':'')+money(r.pnl_net)}</td><td class="num">${money(r.spread_pnl)}</td><td class="${r.pending?'':(r.informed?'bad':'ok')}">${r.pending?'grading':(r.informed?'informed':'uninformed')}</td><td>${r.result?String(r.result).toUpperCase():'open'}</td><td class="num mono" data-exp="${r.expires||''}" data-final="${r.final?1:0}">${cdText(r.expires,r.final)}</td></tr>${sel?fillDetail(r,posMid[r.ticker]):''}`;}).join('');
