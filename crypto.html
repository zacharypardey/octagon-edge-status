<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Source Sans 3",system-ui,sans-serif;font-size:15px;line-height:1.45}
main{max-width:1560px;margin:0 auto;padding:20px 24px 60px}h1,h2,h3{font-family:"Barlow Condensed",sans-serif;margin:0}h1{font-size:40px;line-height:1}h2{font-size:22px;margin-top:26px;padding-top:10px;border-top:2px solid var(--ink)}h3{font-size:17px;margin-top:14px;color:var(--muted)}

table{width:100%;border-collapse:collapse;font-size:12.5px;background:var(--surface);margin-top:10px}table.fit{font-size:12px}table.fit td,table.fit th{padding:6px 7px;white-space:normal;overflow-wrap:anywhere}table.fit td.num,table.fit th.num{white-space:nowrap}table.fit th{white-space:normal;line-height:1.2}th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:600}td.num,th.num{text-align:right;font-family:"JetBrains Mono",monospace;font-variant-numeric:tabular-nums;white-space:nowrap}.wrap{overflow-x:auto}
.ok{color:var(--good);font-weight:600}.bad{color:var(--bad);font-weight:600}.warn{color:#B7791F;font-weight:600}.pill{display:inline-block;padding:2px 8px;border-radius:3px;font-family:"JetBrains Mono",monospace;font-size:11px;background:var(--tile)}.pill.ok{background:var(--good);color:#fff}.pill.bad{background:var(--bad);color:#fff}.small{color:var(--muted);font-size:12px}
.card{background:var(--surface);border:1px solid var(--line);padding:14px 16px;margin-top:12px}.ch{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.ct{font-family:"Barlow Condensed",sans-serif;font-size:19px;font-weight:700}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px}dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:8px 0 0;font-size:13px}dt{color:var(--muted)}dd{margin:0;font-family:"JetBrains Mono",monospace;font-variant-numeric:tabular-nums}
#gate{max-width:420px;margin:80px auto;background:var(--surface);padding:28px;border:1px solid var(--line)}input{width:100%;font-size:16px;padding:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);margin:12px 0}button{font-size:15px;padding:10px 16px;background:var(--accent);color:#fff;border:0;cursor:pointer}label{font-size:13px;color:var(--muted)}#err{color:var(--bad);min-height:1.2em}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
@keyframes rowin{0%{opacity:0;transform:translateX(-14px);background:color-mix(in srgb,var(--accent) 28%,transparent)}12%{opacity:1;transform:none;background:color-mix(in srgb,var(--accent) 28%,transparent)}100%{background:transparent}}@keyframes rowchg{0%{background:color-mix(in srgb,var(--good) 30%,transparent)}100%{background:transparent}}@keyframes rowbad{0%{background:color-mix(in srgb,var(--bad) 30%,transparent)}100%{background:transparent}}tr.new td{animation:rowin 4s ease-out}td.up{animation:rowchg 2.5s ease-out}td.down{animation:rowbad 2.5s ease-out}@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--good) 60%,transparent)}100%{box-shadow:0 0 0 14px transparent}}@keyframes pulsebad{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--bad) 60%,transparent)}100%{box-shadow:0 0 0 14px transparent}}.tile.pulse{animation:pulse 1.6s ease-out}.tile.pulsebad{animation:pulsebad 1.6s ease-out}@keyframes toastin{0%{opacity:0;transform:translateY(12px)}10%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0}}#toasts{position:fixed;right:16px;bottom:16px;z-index:60;display:flex;flex-direction:column;gap:8px;max-width:380px}.toast{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-left:4px solid var(--accent);padding:10px 12px;font-size:13px;box-shadow:0 6px 18px rgba(0,0,0,.25);animation:toastin 6s ease-out forwards}.toast b{display:block;font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}.toast.good{border-left-color:var(--good)}.toast.bad{border-left-color:var(--bad)}
#tip{position:fixed;z-index:50;max-width:340px;background:var(--ink);color:var(--surface);font-size:12.5px;line-height:1.4;padding:8px 10px;border-radius:4px;box-shadow:0 4px 14px rgba(0,0,0,.25);pointer-events:none;white-space:normal}
</style></head><body><main>
<div id="gate"><div class="eyebrow">Bitcoin · Kalshi 15-minute windows</div><h1>Conviction</h1><p class="small">One-sided quotes where the model disagrees with the market, taker orders where it disagrees a lot. Bitcoin, paper. This page is public but its data is encrypted. Enter the passphrase to decrypt it in your browser; nothing is sent anywhere.</p>
<form id="f"><label for="pw">Passphrase</label><input id="pw" type="password" autocomplete="current-password" autofocus><div class="row"><button type="submit">Unlock</button><label><input type="checkbox" id="rem" style="width:auto;margin:0 6px 0 0">remember on this device</label></div><div id="err"></div></form></div>
<div id="app" hidden></div>
</main>
<script>
const $=s=>document.querySelector(s);const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));let KEYS={},CUR=null,MODE='github',LASTUPD=0,ES=null;
const LOCAL=/^(127\.0\.0\.1|localhost)$/.test(location.hostname);const MAIN=(LOCAL&&location.port&&location.port!=='8787')?'http://127.0.0.1:8787/':'index.html';   // the dedicated crypto server (8788) has no main page
async function decrypt(enc,pw){let k=KEYS[enc.salt];if(!k){const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);k=KEYS[enc.salt]=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(enc.salt),iterations:enc.iter,hash:'SHA-256'},key,{name:'AES-GCM',length:256},false,['decrypt']);}const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(enc.iv)},k,b64(enc.ct));if(enc.gz){const txt=await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream('gzip'))).text();return JSON.parse(txt);}return JSON.parse(new TextDecoder().decode(pt));}
async function loadGithub(pw){const r=await fetch('status.enc.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('status file missing');return decrypt(await r.json(),pw);}
async function token(pw){const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('octagon-live:'+pw));return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('');}
async function loadLocal(pw){const r=await fetch('/status?t='+await token(pw),{cache:'no-store'});if(!r.ok)throw new Error('local server');return decrypt(await r.json(),pw);}
async function load(pw){if(LOCAL){try{const P=await loadLocal(pw);MODE='live';return P;}catch(e){}}MODE='github';return loadGithub(pw);}
async function startLive(pw){if(!LOCAL)return;const t=await token(pw);const open=()=>{if(ES)ES.close();ES=new EventSource('/sse?t='+t);ES.onmessage=async e=>{try{CUR=await decrypt(JSON.parse(e.data),pw);LASTUPD=Date.now();MODE='live';render(CUR);}catch(err){}};ES.onerror=()=>{MODE='github';setTimeout(()=>{if(!ES||ES.readyState===2)open();},5000);};};open();document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){if(!ES||ES.readyState===2)open();}else if(ES){ES.close();ES=null;}});}
const money=v=>v==null||Number.isNaN(v)?'—':(v<0?'−$':'$')+Math.abs(v).toLocaleString(undefined,Math.abs(v)<100?{minimumFractionDigits:2,maximumFractionDigits:2}:{maximumFractionDigits:0});
const exact=v=>v==null?'—':(v<0?'−$':'$')+Math.abs(v).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const sg=v=>v==null?'—':(v>=0?'+':'')+money(v);const sgx=v=>v==null?'—':(v>=0?'+':'')+exact(v);const pct=v=>v==null?'—':(v*100).toFixed(1)+'%';const spct=v=>v==null?'—':(v>=0?'+':'')+(v*100).toFixed(1)+'%';
const c1=v=>v==null?'—':(v*100).toFixed(1)+'¢';const ct=v=>v==null?'—':(v>=0?'+':'')+v.toFixed(2)+'¢';const n0=v=>v==null?'—':Math.round(v).toLocaleString();
const et=ts=>{const d=new Date(typeof ts==='number'?ts*1000:ts);return isNaN(d)?String(ts||''):d.toLocaleString('en-US',{timeZone:'America/New_York',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})+' ET'};
const cdText=iso=>{if(!iso)return '—';const ms=new Date(iso)-Date.now();if(isNaN(ms))return '—';if(ms<=0)return 'settling…';const s=Math.floor(ms/1000),m=Math.floor(s/60),c=s%60;return m+'m '+String(c).padStart(2,'0')+'s';};setInterval(()=>document.querySelectorAll('[data-exp]').forEach(el=>{el.textContent=cdText(el.dataset.exp);}),1000);
const cls=v=>(v||0)>=0?'ok':'bad';const BAND={'0':'10+ min left','1':'5–10 min left','2':'2–5 min left'};
let SEEN=null,PREV={};function toast(kind,msg,c){let box=document.getElementById('toasts');if(!box){box=document.createElement('div');box.id='toasts';document.body.appendChild(box);}const d=document.createElement('div');d.className='toast '+(c||'');d.innerHTML='<b>'+kind+'</b>'+msg;box.appendChild(d);setTimeout(()=>d.remove(),6200);while(box.children.length>4)box.firstChild.remove();}
setInterval(()=>{const el=document.getElementById('upd');if(el&&LASTUPD)el.textContent=Math.round((Date.now()-LASTUPD)/1000)+' s ago';},1000);
function markFill(f,h,res){const sign=f.side==='bid'?1:-1;let mark=null,status='open';if(res&&res[f.t]){mark=res[f.t]==='yes'?1:0;status='settled '+res[f.t].toUpperCase();}else if(f.t===h.window&&h.kalshi_mid!=null){mark=h.kalshi_mid;status='open · mid '+c1(mark);}else if(f.t!==h.window){status='settling…';}const gross=mark==null?null:(mark-f.price)*sign*f.qty;return {mark,status,gross,net:gross==null?null:gross-(f.fee||0),edge:f.p==null?null:(f.p-f.price)*sign*f.qty};}
const CHARTS={};let CH=0;
function chart(curve,start,label){if(!curve||curve.length<3)return '<p class="small">equity curve appears after a few minutes of trading</p>';const W=980,H=190,L=74,R=104,T=12,B=26;const es=curve.map(p=>p[1]);const mx=Math.max(...es,start),mn=Math.min(...es,start);const pad=Math.max((mx-mn)*0.12,25);const lo=mn-pad,hi=mx+pad;const x=i=>L+i/(curve.length-1)*(W-L-R),y=v=>T+(hi-v)/(hi-lo)*(H-T-B);const pts=curve.map((p,i)=>`${x(i).toFixed(1)},${y(p[1]).toFixed(1)}`);const last=es[es.length-1];const t0=curve[0][0],t1=curve[curve.length-1][0];const span=(t1-t0)/3600;const y0=y(start).toFixed(1);
const area=`M${pts[0]} L${pts.join(' L')} L${x(curve.length-1).toFixed(1)},${y0} L${x(0).toFixed(1)},${y0} Z`;const line=pts.join(' ');const up=last>=start;const cid='c'+(++CH);CHARTS[cid]={W,H,start,label,pts:curve.map((p,i)=>({x:x(i),y:y(p[1]),t:p[0],v:p[1]}))};
const fmt=(t,d)=>new Date(t*1000).toLocaleString('en-US',{timeZone:'America/New_York',...(d?{month:'short',day:'numeric'}:{}),hour:'numeric',minute:'2-digit'});const cand=[...new Set([0,0.25,0.5,0.75,1].map(f=>Math.round(f*(curve.length-1))))].map(i=>({i,x:x(i)}));const kept=[];for(const c of cand){if(kept.length&&c.x-kept[kept.length-1].x<130){if(c.i===cand[cand.length-1].i)kept.pop();else continue;}kept.push(c);}const ticks=kept.map((c,k)=>`<text x="${c.x.toFixed(1)}" y="${H-8}" text-anchor="${k===0?'start':k===kept.length-1?'end':'middle'}" class="mono" style="font-size:10px;fill:var(--muted)">${fmt(curve[c.i][0],k===0||span>=20)}</text>`).join('');
const gy=[mx,mn].filter(v=>Math.abs(v-start)>pad*0.3).map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="var(--line)" stroke-dasharray="1 5"/><text x="${L-8}" y="${(y(v)+4).toFixed(1)}" text-anchor="end" class="mono" style="font-size:10px;fill:var(--muted)">${exact(v)}</text>`).join('');
return `<div class="ch" style="margin-top:8px"><span class="ct">${label}</span><span class="small">${span>=1?span.toFixed(1)+' hours':Math.round(span*60)+' minutes'} · one point a minute, marked at the Kalshi mid · start ${exact(start)} · <span class="ok">green</span> above the start, <span class="bad">red</span> below</span></div><svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;cursor:crosshair" role="img" aria-label="${label}" data-chart="${cid}"><defs><clipPath id="cup"><rect x="0" y="0" width="${W}" height="${y0}"/></clipPath><clipPath id="cdn"><rect x="0" y="${y0}" width="${W}" height="${(H-y0).toFixed(1)}"/></clipPath></defs>${gy}<path d="${area}" fill="var(--good)" fill-opacity="0.16" clip-path="url(#cup)"/><path d="${area}" fill="var(--bad)" fill-opacity="0.16" clip-path="url(#cdn)"/><polyline points="${line}" fill="none" stroke="var(--good)" stroke-width="2" clip-path="url(#cup)"/><polyline points="${line}" fill="none" stroke="var(--bad)" stroke-width="2" clip-path="url(#cdn)"/><line x1="${L}" x2="${W-R}" y1="${y0}" y2="${y0}" stroke="var(--ink)" stroke-dasharray="2 4" stroke-opacity="0.7"/><text x="${L-8}" y="${(+y0+4).toFixed(1)}" text-anchor="end" class="mono" style="font-size:10px;fill:var(--muted)">${exact(start)}</text><g class="hov" style="display:none"><line class="hl" x1="0" x2="0" y1="${T}" y2="${H-B}" stroke="var(--ink)" stroke-opacity="0.5" stroke-dasharray="3 3"/><circle class="hd" r="4.5" fill="var(--ink)"/></g><circle cx="${x(curve.length-1).toFixed(1)}" cy="${y(last).toFixed(1)}" r="3.5" fill="${up?'var(--good)':'var(--bad)'}"/><text x="${(x(curve.length-1)+9).toFixed(1)}" y="${(y(last)+4).toFixed(1)}" text-anchor="start" class="mono" style="font-size:11px;font-weight:600;fill:${up?'var(--good)':'var(--bad)'}">${exact(last)}</text>${ticks}</svg>`;}
let SPK=0;function spark(pts,start){if(!pts||pts.length<2)return '';const W=160,H=34;const es=pts.map(p=>p[1]);const s0=start==null?es[0]:start;const mx=Math.max(...es,s0),mn=Math.min(...es,s0);const rng=Math.max(mx-mn,1);const x=i=>i/(pts.length-1)*W,y=v=>2+(mx-v)/rng*(H-4);const P=pts.map((p,i)=>`${x(i).toFixed(1)},${y(p[1]).toFixed(1)}`);const y0=y(s0).toFixed(1);const id=++SPK;const cid='s'+id;CHARTS[cid]={W,H,start:s0,label:'sleeve equity',pts:pts.map((p,i)=>({x:x(i),y:y(p[1]),t:p[0],v:p[1]}))};const area=`M${P[0]} L${P.join(' L')} L${W},${y0} L0,${y0} Z`;return `<svg viewBox="0 0 ${W} ${H}" style="width:160px;height:34px;vertical-align:middle;cursor:crosshair" data-chart="${cid}"><defs><clipPath id="su${id}"><rect x="0" y="0" width="${W}" height="${y0}"/></clipPath><clipPath id="sd${id}"><rect x="0" y="${y0}" width="${W}" height="${(H-y0).toFixed(1)}"/></clipPath></defs><path d="${area}" fill="var(--good)" fill-opacity="0.2" clip-path="url(#su${id})"/><path d="${area}" fill="var(--bad)" fill-opacity="0.2" clip-path="url(#sd${id})"/><polyline points="${P.join(' ')}" fill="none" stroke="var(--good)" stroke-width="1.5" clip-path="url(#su${id})"/><polyline points="${P.join(' ')}" fill="none" stroke="var(--bad)" stroke-width="1.5" clip-path="url(#sd${id})"/><line x1="0" x2="${W}" y1="${y0}" y2="${y0}" stroke="var(--muted)" stroke-dasharray="1 3"/><g class="hov" style="display:none"><line class="hl" x1="0" x2="0" y1="0" y2="${H}" stroke="var(--ink)" stroke-opacity="0.5"/><circle class="hd" r="3" fill="var(--ink)"/></g></svg>`;}
function plain(r){r=String(r||'');let m;
if(r==='ok')return ['quoting','ok'];if(r==='window not active')return ['window not open yet',''];
if((m=r.match(/^bid only \(([^)]*)\)/)))return ['resting on the BUY side only · our fair is '+m[1].replace('+','')+' above the market','ok'];
if((m=r.match(/^ask only \(([^)]*)\)/)))return ['resting on the SELL side only · our fair is '+m[1].replace('-','')+' below the market','ok'];
if((m=r.match(/^no disagreement \(([^)]*)\)/)))return ['standing aside · model within 2¢ of the market ('+m[1]+')',''];
if(/^jump/.test(r))return ['paused · sudden price jump, quotes resume about 30 s after it calms','warn'];
if(/warming up/.test(r))return ['warming up · needs five minutes of price data after a restart','warn'];
if(/^no reference/.test(r))return ['waiting for Kalshi to publish the reference price','warn'];
if(/^composite stale/.test(r))return ['waiting for fresh exchange prices','warn'];
if(/^wind-down/.test(r))return ['last 90 seconds · no new quotes, positions ride to settlement',''];
if(/^open wait/.test(r))return ['first minute of the window · no quotes yet',''];
if(/sweep/.test(r))return ['one side pulled · a large sweep just hit it','warn'];
if(/^markout pause/.test(r))return ['paused · recent fills were picked off ('+r.replace('markout pause ','')+')','warn'];
if(/daily loss limit/.test(r))return ['halted for the day · loss limit hit','bad'];
if(/^taker: waiting/.test(r)){const d=(r.match(/done \[([^\]]*)\]/)||[])[1]||'';return ['watching for a 6–12¢ disagreement'+(d?' · already traded: '+d.split(',').filter(Boolean).map(b=>BAND[b.trim()]||b).join(', '):''),''];}
if(/^taker:/.test(r))return ['order sent · '+r.replace('taker: ',''),'ok'];
return [r,''];}

function showTipHtml(html,x,y){if(!TIP){TIP=document.createElement('div');TIP.id='tip';document.body.appendChild(TIP);}TIP.innerHTML=html;TIP.hidden=false;const w=TIP.offsetWidth,h=TIP.offsetHeight;let left=x+14,top=y-h-14;if(left+w>window.innerWidth-8)left=Math.max(8,x-w-14);if(top<8)top=y+18;TIP.style.left=left+'px';TIP.style.top=top+'px';}
function chartHover(e){const svg=e.target.closest('svg[data-chart]');if(!svg)return false;const C=CHARTS[svg.dataset.chart];if(!C||!C.pts.length)return false;const r=svg.getBoundingClientRect();const sx=(e.clientX-r.left)*C.W/r.width;let best=0,bd=1e9;C.pts.forEach((p,i)=>{const d=Math.abs(p.x-sx);if(d<bd){bd=d;best=i;}});const p=C.pts[best];const g=svg.querySelector('g.hov');if(g){g.style.display='';const l=g.querySelector('line.hl');l.setAttribute('x1',p.x.toFixed(1));l.setAttribute('x2',p.x.toFixed(1));const d=g.querySelector('circle.hd');d.setAttribute('cx',p.x.toFixed(1));d.setAttribute('cy',p.y.toFixed(1));}const diff=p.v-C.start;const when=new Date(p.t*1000).toLocaleString('en-US',{timeZone:'America/New_York',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});showTipHtml(`<b style="display:block;font-family:JetBrains Mono,monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;opacity:.75;margin-bottom:3px">${when} ET</b><span style="font-size:15px;font-weight:600">${exact(p.v)}</span> <span style="opacity:.85">${diff>=0?'+':'−'}${exact(Math.abs(diff)).replace('$','$')} vs start (${(100*diff/C.start).toFixed(2)}%)</span>`,e.clientX,e.clientY);return true;}
function chartLeave(e){const svg=e.target.closest&&e.target.closest('svg[data-chart]');if(svg){const g=svg.querySelector('g.hov');if(g)g.style.display='none';hideTip();}}
document.addEventListener('mousemove',e=>{chartHover(e);});document.addEventListener('mouseout',e=>{if(e.target.closest&&e.target.closest('svg[data-chart]')&&!(e.relatedTarget&&e.relatedTarget.closest&&e.relatedTarget.closest('svg[data-chart]')))chartLeave(e);});document.addEventListener('touchstart',e=>{const t=e.touches[0];if(t)chartHover({target:t.target,clientX:t.clientX,clientY:t.clientY});},{passive:true});
let TIP=null;function showTip(el,x,y){if(!TIP){TIP=document.createElement('div');TIP.id='tip';document.body.appendChild(TIP);}TIP.textContent=el.dataset.tip;TIP.hidden=false;const w=TIP.offsetWidth,h=TIP.offsetHeight;let left=x+14,top=y+18;if(left+w>window.innerWidth-8)left=Math.max(8,x-w-14);if(top+h>window.innerHeight-8)top=Math.max(8,y-h-14);TIP.style.left=left+'px';TIP.style.top=top+'px';}
function hideTip(){if(TIP)TIP.hidden=true;}
document.addEventListener('mouseover',e=>{if(e.target.closest&&e.target.closest('svg[data-chart]'))return;const el=e.target.closest('[data-tip]');if(el)showTip(el,e.clientX,e.clientY);else hideTip();});document.addEventListener('mousemove',e=>{if(e.target.closest&&e.target.closest('svg[data-chart]'))return;const el=e.target.closest('[data-tip]');if(el&&TIP&&!TIP.hidden)showTip(el,e.clientX,e.clientY);});document.addEventListener('mouseout',e=>{if(!e.relatedTarget||!e.relatedTarget.closest||!e.relatedTarget.closest('[data-tip]'))hideTip();});document.addEventListener('click',e=>{const el=e.target.closest('[data-tip]');if(el){if(TIP&&!TIP.hidden&&TIP.textContent===el.dataset.tip)hideTip();else showTip(el,e.clientX,e.clientY);}});
