<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Octagon Edge · Crypto</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Source+Sans+3:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{--bg:#F2F4F7;--surface:#fff;--ink:#16212B;--muted:#5C6B78;--line:#D6DCE3;--accent:#C4162B;--good:#1F7A4D;--bad:#B23A2A;--tile:#EEF1F5}
@media (prefers-color-scheme:dark){:root{--bg:#0F1418;--surface:#171D23;--ink:#E9EDF0;--muted:#98A5B0;--line:#2B353E;--accent:#FF4D5E;--good:#4CC38A;--bad:#F07C6C;--tile:#1E262E}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Source Sans 3",system-ui,sans-serif;font-size:15px;line-height:1.45}
main{max-width:1560px;margin:0 auto;padding:20px 24px 60px}h1,h2,h3{font-family:"Barlow Condensed",sans-serif;margin:0}h1{font-size:40px;line-height:1}h2{font-size:22px;margin-top:26px;padding-top:10px;border-top:2px solid var(--ink)}h3{font-size:17px;margin-top:14px;color:var(--muted)}
.eyebrow{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}.mono{font-family:"JetBrains Mono",monospace;font-variant-numeric:tabular-nums}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}.top a{color:var(--accent);text-decoration:none;font-weight:600}.top a:hover{text-decoration:underline}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-top:14px}.tile{background:var(--surface);border:1px solid var(--line);padding:12px 14px;min-height:78px}.tile .k{font-family:"Barlow Condensed",sans-serif;font-size:30px;line-height:1;font-weight:700}.tile .l{color:var(--muted);font-size:12px;margin-top:6px;line-height:1.35}.tile.hero{border-color:var(--ink)}
.gates{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px;margin-top:10px}.gate{background:var(--surface);border:1px solid var(--line);padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}.gate .gl{font-size:12px;color:var(--muted)}.gate .gv{font-family:"JetBrains Mono",monospace;font-size:13px;font-weight:600}.gate .bar{grid-column:1/3;height:6px;background:var(--tile);position:relative}.gate .bar span{position:absolute;left:0;top:0;bottom:0;background:var(--bad)}.gate .bar span.g{background:var(--good)}
table{width:100%;border-collapse:collapse;font-size:12.5px;background:var(--surface);margin-top:10px}th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:600}td.num,th.num{text-align:right;font-family:"JetBrains Mono",monospace;font-variant-numeric:tabular-nums;white-space:nowrap}.wrap{overflow-x:auto}
.ok{color:var(--good);font-weight:600}.bad{color:var(--bad);font-weight:600}.pill{display:inline-block;padding:2px 8px;border-radius:3px;font-family:"JetBrains Mono",monospace;font-size:11px;background:var(--tile)}.pill.ok{background:var(--good);color:#fff}.pill.bad{background:var(--bad);color:#fff}.small{color:var(--muted);font-size:12px}
.card{background:var(--surface);border:1px solid var(--line);padding:14px 16px;margin-top:12px}.ch{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.ct{font-family:"Barlow Condensed",sans-serif;font-size:19px;font-weight:700}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px}dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:8px 0 0;font-size:13px}dt{color:var(--muted)}dd{margin:0;font-family:"JetBrains Mono",monospace;font-variant-numeric:tabular-nums}
#gate{max-width:420px;margin:80px auto;background:var(--surface);padding:28px;border:1px solid var(--line)}input{width:100%;font-size:16px;padding:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);margin:12px 0}button{font-size:15px;padding:10px 16px;background:var(--accent);color:#fff;border:0;cursor:pointer}label{font-size:13px;color:var(--muted)}#err{color:var(--bad);min-height:1.2em}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
#tip{position:fixed;z-index:50;max-width:340px;background:var(--ink);color:var(--surface);font-size:12.5px;line-height:1.4;padding:8px 10px;border-radius:4px;box-shadow:0 4px 14px rgba(0,0,0,.25);pointer-events:none;white-space:normal}
</style></head><body><main>
<div id="gate"><div class="eyebrow">Octagon Edge · Crypto</div><h1>Bitcoin market maker</h1><p class="small">This page is public but its data is encrypted. Enter the passphrase to decrypt it in your browser; nothing is sent anywhere.</p>
<form id="f"><label for="pw">Passphrase</label><input id="pw" type="password" autocomplete="current-password" autofocus><div class="row"><button type="submit">Unlock</button><label><input type="checkbox" id="rem" style="width:auto;margin:0 6px 0 0">remember on this device</label></div><div id="err"></div></form></div>
<div id="app" hidden></div>
</main>
<script>
const $=s=>document.querySelector(s);const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));let KEYS={},CUR=null,MODE='github',LASTUPD=0,ES=null;
const LOCAL=/^(127\.0\.0\.1|localhost)$/.test(location.hostname);
async function decrypt(enc,pw){let k=KEYS[enc.salt];if(!k){const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);k=KEYS[enc.salt]=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(enc.salt),iterations:enc.iter,hash:'SHA-256'},key,{name:'AES-GCM',length:256},false,['decrypt']);}const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(enc.iv)},k,b64(enc.ct));if(enc.gz){const txt=await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream('gzip'))).text();return JSON.parse(txt);}return JSON.parse(new TextDecoder().decode(pt));}
async function loadGithub(pw){const r=await fetch('status.enc.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('status file missing');return decrypt(await r.json(),pw);}
async function token(pw){const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('octagon-live:'+pw));return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('');}
async function loadLocal(pw){const r=await fetch('/status?t='+await token(pw),{cache:'no-store'});if(!r.ok)throw new Error('local server');return decrypt(await r.json(),pw);}
async function load(pw){if(LOCAL){try{const P=await loadLocal(pw);MODE='live';return P;}catch(e){}}MODE='github';return loadGithub(pw);}
async function startLive(pw){if(!LOCAL)return;const t=await token(pw);const open=()=>{if(ES)ES.close();ES=new EventSource('/sse?t='+t);ES.onmessage=async e=>{try{CUR=await decrypt(JSON.parse(e.data),pw);LASTUPD=Date.now();MODE='live';render(CUR);}catch(err){}};ES.onerror=()=>{MODE='github';};};open();document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){if(!ES||ES.readyState===2)open();}else if(ES){ES.close();ES=null;}});}
const money=v=>v==null||Number.isNaN(v)?'—':(v<0?'−$':'$')+Math.abs(v).toLocaleString(undefined,Math.abs(v)<100?{minimumFractionDigits:2,maximumFractionDigits:2}:{maximumFractionDigits:0});
const exact=v=>v==null?'—':(v<0?'−$':'$')+Math.abs(v).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const sg=v=>v==null?'—':(v>=0?'+':'')+money(v);const sgx=v=>v==null?'—':(v>=0?'+':'')+exact(v);const pct=v=>v==null?'—':(v*100).toFixed(1)+'%';const spct=v=>v==null?'—':(v>=0?'+':'')+(v*100).toFixed(1)+'%';
const c1=v=>v==null?'—':(v*100).toFixed(1)+'¢';const ct=v=>v==null?'—':(v>=0?'+':'')+v.toFixed(2)+'¢';const n0=v=>v==null?'—':Math.round(v).toLocaleString();
const et=ts=>{const d=new Date(typeof ts==='number'?ts*1000:ts);return isNaN(d)?String(ts||''):d.toLocaleString('en-US',{timeZone:'America/New_York',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})+' ET'};
const cdText=iso=>{if(!iso)return '—';const ms=new Date(iso)-Date.now();if(isNaN(ms))return '—';if(ms<=0)return 'settling…';const s=Math.floor(ms/1000),m=Math.floor(s/60),c=s%60;return m+'m '+String(c).padStart(2,'0')+'s';};setInterval(()=>document.querySelectorAll('[data-exp]').forEach(el=>{el.textContent=cdText(el.dataset.exp);}),1000);
const cls=v=>(v||0)>=0?'ok':'bad';const BAND={'0':'10+ min left','1':'5–10 min left','2':'2–5 min left'};
function chart(curve,start,label){if(!curve||curve.length<3)return '<p class="small">equity curve appears after a few minutes of trading</p>';const W=980,H=170,L=74,R=16,T=12,B=26;const es=curve.map(p=>p[1]);const mx=Math.max(...es,start),mn=Math.min(...es,start);const pad=Math.max((mx-mn)*0.12,25);const lo=mn-pad,hi=mx+pad;const x=i=>L+i/(curve.length-1)*(W-L-R),y=v=>T+(hi-v)/(hi-lo)*(H-T-B);const pts=curve.map((p,i)=>`${x(i).toFixed(1)},${y(p[1]).toFixed(1)}`).join(' ');const last=es[es.length-1];const t0=curve[0][0],t1=curve[curve.length-1][0];const span=(t1-t0)/3600;
const ticks=[0,0.25,0.5,0.75,1].map(f=>{const i=Math.round(f*(curve.length-1));return `<text x="${x(i).toFixed(1)}" y="${H-8}" text-anchor="${f===0?'start':f===1?'end':'middle'}" class="mono" style="font-size:10px;fill:var(--muted)">${et(curve[i][0]).replace(' ET','')}</text>`;}).join('');
return `<div class="ch" style="margin-top:8px"><span class="ct">${label}</span><span class="small">${span>=1?span.toFixed(1)+' hours':Math.round(span*60)+' minutes'} · one point a minute, marked at the Kalshi mid · start ${exact(start)}</span></div><svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" role="img" aria-label="${label}"><line x1="${L}" x2="${W-R}" y1="${y(start).toFixed(1)}" y2="${y(start).toFixed(1)}" stroke="var(--muted)" stroke-dasharray="2 4"/><text x="${L-8}" y="${(y(start)+4).toFixed(1)}" text-anchor="end" class="mono" style="font-size:10px;fill:var(--muted)">${exact(start)}</text><polyline points="${pts}" fill="none" stroke="${last>=start?'var(--good)':'var(--bad)'}" stroke-width="2"/><circle cx="${x(curve.length-1).toFixed(1)}" cy="${y(last).toFixed(1)}" r="3.5" fill="var(--accent)"/><text x="${(x(curve.length-1)-8).toFixed(1)}" y="${(y(last)+(last>=start?-8:14)).toFixed(1)}" text-anchor="end" class="mono" style="font-size:11px;fill:var(--ink)">${exact(last)}</text>${ticks}</svg>`;}
function spark(pts){if(!pts||pts.length<2)return '';const W=160,H=34;const es=pts.map(p=>p[1]);const mx=Math.max(...es),mn=Math.min(...es);const rng=Math.max(mx-mn,1);const x=i=>i/(pts.length-1)*W,y=v=>2+(mx-v)/rng*(H-4);return `<svg viewBox="0 0 ${W} ${H}" style="width:160px;height:34px;vertical-align:middle"><polyline points="${pts.map((p,i)=>`${x(i).toFixed(1)},${y(p[1]).toFixed(1)}`).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="1.5"/></svg>`;}
function sleeveRows(rows){return rows.map(s=>{const risk=s.halted?`<span class="pill bad">halted</span> ${s.halt_reason||''}`:((s.size_mult||1)<1?`<span class="pill bad">half size</span> cap ${s.cap}`:`full size · cap ${s.cap==null?'—':s.cap}`)+(s.pause_left_s?` · paused ${s.pause_left_s} s`:'');const tk=s.taker?` <span class="small">${s.taker.pending?'order sent':'bands done '+JSON.stringify(s.taker.done)}</span>`:'';
return `<tr><td><b>${s.sym} ${s.name}</b> ${s.pool?'<span class="pill ok">pool</span>':'<span class="pill">shadow</span>'}${tk}</td><td class="num">${exact(s.start)}</td><td class="num ${cls(s.pnl)}">${exact(s.equity)}</td><td class="num ${cls(s.pnl)}">${sgx(s.pnl)}</td><td class="num ${cls(s.ret)}">${spct(s.ret)}</td><td class="num ${cls(s.day_pnl)}">${sg(s.day_pnl)}</td><td class="num">${s.windows} / ${s.traded_windows}</td><td class="num">${pct(s.win_rate)}</td><td class="num">${s.pnl_per_window==null?'—':sg(s.pnl_per_window)+' ± '+money(s.sd_per_window)}</td><td class="num ${s.t==null?'':(s.t>=2?'ok':s.t<=-2?'bad':'')}">${s.t==null?'—':s.t.toFixed(2)}</td><td class="num">${n0(s.fills)} / ${n0(s.contracts)}</td><td class="num ${cls(s.cents_per_contract)}">${ct(s.cents_per_contract)}</td><td class="num">${ct(s.markout_10)}</td><td class="num ${cls(s.markout_res)}">${ct(s.markout_res)}</td><td class="num">${pct(s.first_share)}</td><td class="num bad">${s.max_dd?money(s.max_dd)+' ('+pct(s.max_dd_pct)+')':'—'}</td><td class="small">${risk}${(s.halts||s.pauses)?` · ${s.halts} halt${s.halts===1?'':'s'}, ${s.pauses} pause${s.pauses===1?'':'s'}`:''}</td><td class="num">${s.inv==null?'—':(+s.inv).toFixed(0)}</td><td class="num">${c1(s.bid)} – ${c1(s.ask)}</td><td class="small">${s.reason||''}</td><td>${spark(s.curve)}</td></tr>`;}).join('');}
const SLEEVE_HEAD=`<tr><th data-tip="One paper account per strategy. pool = a sleeve of the $10k launch bankroll, started at its allocation; shadow = nominal $10,000, data only. model = rests only on the side where the model disagrees with the Kalshi mid by 2¢ or more; wide = the same with a wider band; taker = crosses the spread once per time band on a 6–12¢ disagreement.">sleeve</th><th class="num" data-tip="The balance the account started with (its allocation).">start</th><th class="num" data-tip="Cash plus open inventory marked at the Kalshi mid.">equity</th><th class="num" data-tip="Equity minus start, since the account started.">P&L</th><th class="num" data-tip="P&L as a share of the allocation.">return</th><th class="num" data-tip="Realised P&L this UTC day (closed fills and settled windows). The loss tiers apply to this number and to the pool's sum.">day P&L</th><th class="num" data-tip="Windows settled since the account started / windows in which it had at least one fill.">windows</th><th class="num" data-tip="Share of traded windows with a positive net P&L (fills valued at settlement, net of fees).">win rate</th><th class="num" data-tip="Mean and standard deviation of the per-window net P&L over every settled window (no fills = $0).">per window</th><th class="num" data-tip="Mean per-window P&L divided by its standard error. Above 2 the edge is unlikely to be luck; near 0 nothing is proven either way.">t</th><th class="num" data-tip="Fills / contracts since the account started.">fills / contracts</th><th class="num" data-tip="Net P&L per contract at settlement (resolution value minus fees) over every fill since start.">¢ per contract</th><th class="num" data-tip="Kalshi mid minus our fill price on our side, contract-weighted, 10 seconds after the fill. Negative means the market kept moving against us (adverse selection). Taker fills are excluded from the breaker but included here.">+10 s</th><th class="num" data-tip="Settlement value ($1 or $0) minus the fill price on our side, contract-weighted, before fees.">resolution</th><th class="num" data-tip="Share of maker fills where nobody was queued ahead of us at that price.">first in line</th><th class="num" data-tip="Largest peak-to-trough fall of this account's equity since it started.">max drawdown</th><th data-tip="Risk state: the loss tiers on the day's realised P&L (half size at −5% of the pool, halt at −10%), the inventory cap in force, markout pauses, and how often the breakers fired since start.">risk</th><th class="num" data-tip="Open YES contracts in the current window; negative = sold.">inventory</th><th class="num" data-tip="Our resting bid and ask right now (makers), or nothing for the taker sleeve.">resting</th><th>state</th><th data-tip="Equity since start, one point a minute.">curve</th></tr>`;
function render(P){if(!P)return;const H=P.crypto_home;const C=P.crypto||{};if(!H||H.error){$('#app').innerHTML=`<div class="top"><div><div class="eyebrow">Octagon Edge · Crypto</div><h1>Bitcoin market maker</h1></div><a href="index.html">← main dashboard</a></div><p class="bad" style="margin-top:20px">crypto home payload unavailable${H&&H.error?': '+H.error:''}</p>`;return;}
const PL=H.pool||{};const G=H.gates||[];const sleeves=H.sleeves||[];const shadow=H.shadow||[];const coins=H.coins||{};const syms=Object.keys(coins);const bots=`${PL.bots_live||0}/${PL.bots||0} bot${PL.bots===1?'':'s'} live`;
const state=PL.halted?`<span class="pill bad">${PL.halted} halted</span>`:PL.half?`<span class="pill bad">${PL.half} at half size</span>`:`<span class="pill ok">full size</span>`;
const top=`<div class="top"><div><div class="eyebrow">Octagon Edge · Crypto</div><h1>Bitcoin market maker</h1><p class="small" style="margin:6px 0 0">Paper. Kalshi 15-minute up/down windows, quoted from a live composite of five exchanges. ${sleeves.length} pool sleeve${sleeves.length===1?'':'s'} on a $${(PL.equity_cfg||PL.start||10000).toLocaleString()} launch bankroll${PL.started?', since '+et(PL.started):''}${PL.hours?' ('+PL.hours+' h)':''} · ${bots} · ${MODE==='live'?'live, updates every 5 s':'GitHub copy, refreshed every 15 min'} · payload ${et(P.generated)}</p></div><div><a href="index.html">← main dashboard</a> · <a href="#" id="lock">lock</a></div></div>`;
const hero=`<div class="tiles">
<div class="tile hero" data-tip="Cash plus open inventory marked at the Kalshi mid, summed over the pool sleeves. The bankroll is $${(PL.equity_cfg||10000).toLocaleString()}; each sleeve starts at its allocation."><div class="k ${cls(PL.pnl)}">${exact(PL.equity)}</div><div class="l">pool equity · started at ${exact(PL.start)}</div></div>
<div class="tile hero" data-tip="Pool equity minus what it started with, and that as a share of the bankroll."><div class="k ${cls(PL.pnl)}">${sgx(PL.pnl)}</div><div class="l">net P&L since launch · ${spct(PL.ret)} on the bankroll</div></div>
<div class="tile hero" data-tip="Realised P&L this UTC day over the pool sleeves: closed fills and settled windows. The loss tiers (half size at −$${((PL.equity_cfg||10000)*0.05).toLocaleString()}, halt at −$${((PL.equity_cfg||10000)*0.10).toLocaleString()}) apply to this number."><div class="k ${cls(PL.day_pnl)}">${sg(PL.day_pnl)}</div><div class="l">today's P&L (UTC day) · ${state}</div></div>
<div class="tile hero" data-tip="Mean per-window P&L of the pool divided by its standard error, over every window settled since launch (windows without fills count as $0). Above 2 the edge is unlikely to be luck."><div class="k ${PL.t==null?'':(PL.t>=2?'ok':PL.t<=-2?'bad':'')}">${PL.t==null?'—':PL.t.toFixed(2)}</div><div class="l">edge t-stat · ${PL.windows} windows · ${PL.pnl_per_window==null?'—':sg(PL.pnl_per_window)+' ± '+money(PL.sd_per_window)} per window</div></div>
<div class="tile hero" data-tip="Largest peak-to-trough fall of pool equity since launch, in dollars and as a share of the peak."><div class="k bad">${PL.max_dd?money(PL.max_dd):'—'}</div><div class="l">max drawdown · ${PL.max_dd?pct(PL.max_dd_pct)+' of the peak':'no drawdown yet'}</div></div>
<div class="tile" data-tip="Share of traded windows (at least one fill) whose fills, valued at settlement net of fees, made money."><div class="k">${pct(PL.win_rate)}</div><div class="l">win rate · ${PL.traded_windows} traded of ${PL.windows} windows</div></div>
<div class="tile" data-tip="Net P&L per contract at settlement over every pool fill since launch, after taker fees. This is the number that scales with size."><div class="k ${cls(PL.cents_per_contract)}">${ct(PL.cents_per_contract)}</div><div class="l">per contract · ${n0(PL.fills)} fills · ${n0(PL.contracts)} contracts</div></div>
<div class="tile" data-tip="Kalshi mid minus our fill price on our side 10 seconds after the fill, contract-weighted (adverse selection), and settlement value minus fill price at resolution."><div class="k ${cls(PL.markout_res)}">${ct(PL.markout_res)}</div><div class="l">markout at resolution · +10 s ${ct(PL.markout_10)}</div></div>
</div>`;
const gates=`<h2>Go-live gates</h2><p class="small">The same idea as the main dashboard's gate: what has to be true before this runs with real money. Progress bars fill toward the threshold.</p><div class="gates">${G.map(g=>{const isMax=g.max!=null;const v=g.v;const shown=g.key==='quotable'||g.key==='throttle'?pct(v):g.key==='markout_res'?ct(v):v==null?'—':(+v).toLocaleString(undefined,{maximumFractionDigits:2});const lim=isMax?(g.key==='throttle'?pct(g.max):g.max):(g.key==='quotable'?pct(g.min):g.key==='markout_res'?'> 0':g.min);const frac=v==null?0:isMax?(g.max>0?Math.min(1,v/g.max):(v>0?1:0)):(g.key==='markout_res'?(v>0?1:0):Math.max(0,Math.min(1,v/g.min)));return `<div class="gate" data-tip="${g.tip.replace(/"/g,'&quot;')}"><span class="gl">${g.label}</span><span class="gv ${g.ok?'ok':'bad'}">${shown} <span class="small">· ${isMax?'max':'min'} ${lim}</span></span><div class="bar"><span class="${g.ok?'g':''}" style="width:${(frac*100).toFixed(0)}%"></span></div></div>`;}).join('')}</div>`;
const curve=`<div class="card">${chart(PL.curve,PL.start,'Pool equity since launch')}</div>`;
const table=`<h2>Sleeves</h2><p class="small">Every number is since the account started. Hover a column for its definition.</p><div class="wrap"><table>${SLEEVE_HEAD}${sleeveRows(sleeves)}</table></div>${shadow.length?`<h3>Shadow accounts (data only, not in the pool)</h3><div class="wrap"><table>${SLEEVE_HEAD}${sleeveRows(shadow)}</table></div>`:''}`;
const coinCards=syms.map(k=>{const c=coins[k];const S=(C.symbols||{})[k]||{};const T=S.today||{};const feeds=c.feeds&&typeof c.feeds==='object'?Object.entries(c.feeds).map(([n,v])=>`<span class="pill ${(v&&(v.fresh===false||v.ok===false))?'bad':''}" data-tip="${String(JSON.stringify(v)).replace(/"/g,'&quot;').slice(0,300)}">${n}${v&&v.age_ms!=null?' '+Math.round(v.age_ms)+' ms':''}</span>`).join(' '):'';

let TIP=null;function showTip(el,x,y){if(!TIP){TIP=document.createElement('div');TIP.id='tip';document.body.appendChild(TIP);}TIP.textContent=el.dataset.tip;TIP.hidden=false;const w=TIP.offsetWidth,h=TIP.offsetHeight;let left=x+14,top=y+18;if(left+w>window.innerWidth-8)left=Math.max(8,x-w-14);if(top+h>window.innerHeight-8)top=Math.max(8,y-h-14);TIP.style.left=left+'px';TIP.style.top=top+'px';}
function hideTip(){if(TIP)TIP.hidden=true;}
document.addEventListener('mouseover',e=>{const el=e.target.closest('[data-tip]');if(el)showTip(el,e.clientX,e.clientY);else hideTip();});document.addEventListener('mousemove',e=>{const el=e.target.closest('[data-tip]');if(el&&TIP&&!TIP.hidden)showTip(el,e.clientX,e.clientY);});document.addEventListener('mouseout',e=>{if(!e.relatedTarget||!e.relatedTarget.closest||!e.relatedTarget.closest('[data-tip]'))hideTip();});document.addEventListener('click',e=>{const el=e.target.closest('[data-tip]');if(el){if(TIP&&!TIP.hidden&&TIP.textContent===el.dataset.tip)hideTip();else showTip(el,e.clientX,e.clientY);}});
async function go(pw){try{const P=await load(pw);CUR=P;LASTUPD=Date.now();$('#gate').hidden=true;$('#app').hidden=false;render(P);sessionStorage.setItem('pw',pw);if($('#rem')&&$('#rem').checked)localStorage.setItem('pw',pw);startLive(pw);setInterval(async()=>{if(MODE!=='live'){try{CUR=await load(pw);render(CUR);}catch(e){}}},60000);}catch(e){$('#err').textContent='Could not decrypt: wrong passphrase or missing data.';}}
$('#f').addEventListener('submit',e=>{e.preventDefault();go($('#pw').value)});const saved=localStorage.getItem('pw')||sessionStorage.getItem('pw');if(saved)go(saved);
